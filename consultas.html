
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filtro de Contratos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Filtrar Contratos</h2>

    <div class="card p-4 shadow-sm">
      <div class="row g-3">

        <div class="col-md-4">
          <label class="form-label fw-bold">Tipo de Contrato</label>
          <select id="tipo" class="form-select">
            <option value="">-- Todos --</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Concepto (columna I)</label>
          <input id="concepto" class="form-control" placeholder="Buscar concepto..." />
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Fecha Fin (antes de)</label>
          <input type="date" id="fecha" class="form-control" />
        </div>

      </div>

      <button class="btn btn-primary mt-4 w-100" onclick="filtrar()">
        Aplicar Filtros
      </button>
    </div>

    <div class="card mt-4 shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">Resultados</h4>

        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Núm. Cliente</th>
                <th>Núm. DCT SAP</th>
                <th>Núm. Contrato</th>
                <th>Tipo Contrato</th>
                <th>Concepto</th>
                <th>Fecha Fin</th>
              </tr>
            </thead>
            <tbody id="tabla"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxpnAkOe5k7GoW-ICJ9lpJlGCNDSxL9YG924e2jQfuO1xAD6-LCJXjHjr5-Tk6rZxl0/exec"; // ← PÉGALA AQUÍ

    async function cargarTipos() {
      const res = await fetch(API_URL + "?action=getTipos");
      const tipos = await res.json();

      const select = document.getElementById("tipo");
      tipos.forEach(t => {
        select.innerHTML += `<option value="${t}">${t}</option>`;
      });
    }

    async function filtrar() {
      const tipo = document.getElementById("tipo").value;
      const concepto = document.getElementById("concepto").value;
      const fecha = document.getElementById("fecha").value;

      const url =
        `${API_URL}?action=filter` +
        `&tipo=${encodeURIComponent(tipo)}` +
        `&concepto=${encodeURIComponent(concepto)}` +
        `&fecha=${encodeURIComponent(fecha)}`;

      const res = await fetch(url);
      mostrar(await res.json());
    }

    function mostrar(data) {
      const tbody = document.getElementById("tabla");
      tbody.innerHTML = "";

      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Sin resultados</td></tr>`;
        return;
      }

      data.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td>${r.id || ""}</td>
            <td>${r.numCliente || ""}</td>
            <td>${r.numDctSap || ""}</td>
            <td>${r.numContrato || ""}</td>
            <td>${r.tipoContrato || ""}</td>
            <td>${r.concepto || ""}</td>
            <td>${r.fechaFin || ""}</td>
          </tr>
        `;
      });
    }

    async function cargarTodo() {
      await cargarTipos();
      const res = await fetch(API_URL + "?action=getData");
      mostrar(await res.json());
    }

    cargarTodo();
  </script>
</body>
</html>
