
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filtro de Contratos</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Filtrar Contratos</h2>

    <!-- Filtros -->
    <div class="card p-4 shadow-sm">
      <div class="row g-3">
        
        <div class="col-md-4">
          <label class="form-label fw-bold">Tipo de Contrato</label>
          <select id="tipo" class="form-select">
            <option value="">-- Todos --</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Razón Social</label>
          <input id="razon" class="form-control" placeholder="Buscar..." />
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Fecha Fin (antes de)</label>
          <input type="date" id="fecha" class="form-control" />
        </div>

      </div>

      <button class="btn btn-primary mt-4 w-100" onclick="filtrar()">
        Aplicar Filtros
      </button>
    </div>

    <!-- Resultados -->
    <div class="card mt-4 shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">Resultados</h4>

        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead class="table-dark">
              <tr>
                <th>Tipo Contrato</th>
                <th>Razón Social</th>
                <th>Fecha Fin</th>
              </tr>
            </thead>
            <tbody id="tabla"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------
    // 🚨 PON AQUÍ LA URL DE TU WEB APP DE APPS SCRIPT
    // ---------------------------------------------------
    const API_URL = "https://script.google.com/macros/s/AKfycbzxt83aF2VnHo72KeS0T9htXEfU1WiQo6-FK4H9zIRJJMDmHfkborKcuwpi8UqRh5-G/exec";
    //

    // Cargar tipos de contrato al inicio
    async function cargarTipos() {
      try {
        const res = await fetch(API_URL + "?action=getTipos");
        const tipos = await res.json();

        const select = document.getElementById("tipo");
        tipos.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = t;
          select.appendChild(opt);
        });

      } catch (err) {
        console.error("Error cargando tipos", err);
      }
    }

    // Filtrar
    async function filtrar() {
      const tipo = document.getElementById("tipo").value;
      const razon = document.getElementById("razon").value;
      const fecha = document.getElementById("fecha").value;

      const url =
        `${API_URL}?action=filter` +
        `&tipo=${encodeURIComponent(tipo)}` +
        `&razon=${encodeURIComponent(razon)}` +
        `&fecha=${encodeURIComponent(fecha)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        mostrar(data);
      } catch (err) {
        console.error("Error filtrando", err);
      }
    }

    // Mostrar resultados en la tabla
    function mostrar(data) {
      const tbody = document.getElementById("tabla");
      tbody.innerHTML = "";

      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Sin resultados</td></tr>`;
        return;
      }

      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.tipoContrato || ""}</td>
          <td>${row.razonSocial || ""}</td>
          <td>${row.fechaFin || ""}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Cargar datos iniciales
    async function cargarTodo() {
      await cargarTipos();

      // mostrar todos al inicio
      const res = await fetch(API_URL + "?action=getData");
      mostrar(await res.json());
    }

    cargarTodo();
  </script>

</body>
</html>
