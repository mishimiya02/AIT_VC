    <div class="main-wrapper"> <!-- Nuevo contenedor para los márgenes -->
        <div class="main-container">
            <div class="form-container" id="form-left">
                <h2>CONTRATO PASADO </h2>
                <form action="#" method="post">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                    
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                    
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4"></textarea>
                    
                    <button type="submit">Enviar</button>
                </form>
            </div>
            






















            
            <div class="form-container" id="form-right">
                <h2> CONTRATO RECIENTE </h2>
                <form action="#" method="post">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required>
                    
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" required>
                    
                    <label for="pais">País:</label>
                    <select id="pais" name="pais">
                        <option value="">Seleccione un país</option>
                        <option value="mx">México</option>
                        <option value="es">España</option>
                        <option value="ar">Argentina</option>
                        <option value="co">Colombia</option>
                    </select>
                    
                    <label>
                        <input type="checkbox" name="recordar"> Recordar mis datos
                    </label>
                    
                    <button type="submit">Iniciar sesión</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
