            function calcular() {
              const inicio = document.getElementById('fecha-inicio').value;
              const fin = document.getElementById('fecha-fin').value;
              const monto = parseFloat(document.getElementById('cantidad').value);
              const resultado = document.getElementById('resultado');
              const ajuste = document.getElementById('ajuste');
        
              if (inicio && fin && inflacion[inicio] && inflacion[fin]) {
                const indiceInicio = inflacion[inicio];
                const indiceFin = inflacion[fin];
        
                resultado.innerHTML = `
                 <strong> Índice en ${inicio}: ${indiceInicio}</strong><br><br>
                 <strong> Índice en ${fin}: ${indiceFin}</strong><br><br>
                `;
        
                if (!isNaN(monto)) {
                  const ajustado = monto * (indiceFin / indiceInicio);
                  ajuste.innerHTML = `
                   <strong> Valor ajustado por inflación: $${ajustado.toFixed(2)}</strong>
                  `;
                } else {
                  ajuste.innerHTML = '';
                }
              } else {
                resultado.innerHTML = 'Fechas no válidas o fuera de rango.';
                ajuste.innerHTML = '';
              }
            }
