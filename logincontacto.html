<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso</title>

<style>
body {
  background: linear-gradient(135deg, #16a34a, #22c55e);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Inter, sans-serif;
}

.login-box {
  background: white;
  padding: 40px;
  border-radius: 16px;
  width: 320px;
  box-shadow: 0 15px 40px rgba(0,0,0,.2);
  text-align: center;
}

.login-box h2 {
  margin-bottom: 20px;
  color: #166534;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 16px;
  border-radius: 10px;
  border: 1px solid #d1fae5;
  font-size: 1rem;
}

button {
  width: 100%;
  padding: 12px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #15803d;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Acceso</h2>


   <input type="password" id="password" placeholder="Contraseña">

<button id="btnLogin" type="button">Entrar</button>


</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
const passwordsValidas = ["JM", "AIT"];

document.getElementById("btnLogin").addEventListener("click", function () {
  const password = document.getElementById("password").value
    .trim()
    .toUpperCase();

  if (password.length < 2 || password.length > 3) {
    Swal.fire({
      icon: "warning",
      title: "Formato inválido",
      text: "La contraseña debe tener más de 1 caracter",
      confirmButtonColor: "#16a34a"
    });
    return;
  }

  if (passwordsValidas.includes(password)) {
    localStorage.setItem("accesoLinks", "true");
    window.location.href = "contacto.html";
  } else {
    Swal.fire({
      icon: "error",
      title: "Acceso denegado",
      text: "Contraseña incorrecta",
      confirmButtonColor: "#16a34a"
    });
  }
});
</script>
</body>
</html>
