        // Mostrar el loader cuando la página comience a cargar
        document.addEventListener('DOMContentLoaded', function() {
            AvionLoading.mostrar();
        });

        // Ocultar el loader cuando todo esté cargado
        window.addEventListener('load', function() {
            setTimeout(function() {
                AvionLoading.ocultar();
            }, 2000); // 2 segundos de demostración
        });

        // También puedes usarlo para transiciones entre páginas
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A' && e.target.href) {
                e.preventDefault();
                AvionLoading.mostrar();
                
                // Navegar después de mostrar el loader
                setTimeout(function() {
                    window.location.href = e.target.href;
                }, 500);
            }
        });

       
    </script>

  <h1>REGISTRAR CONTRATOS*</h1>

  <div class="cedula-container">

    <h3>DATOS GENERALES</h3>
    <div class="form-group">
      <label for="CUENTA">Número de cuenta <span class="required">*</span></label>
      <input type="text" id="CUENTA" name="CUENTA" required>
    </div>

    <div class="form-group">
      <label for="numsap">Número de doc. SAP <span class="required">*</span></label>
      <input type="text" id="numsap" name="numsap" required>
    </div>

    <div class="form-group">
      <label for="numcontrato">NUM. Contrato <span class="required">*</span></label>
      <input type="text" id="numcontrato" name="numcontrato" required>
    </div>

    <div class="form-group">
      <label for="tipo">TIPO:<span class="required">*</span></label>
      <select id="tipo" name="tipo" required>
        <option value="">- Selecciona -</option>
        <option value="1">Contrato C</option>
        <option value="2">Convenio Modificatorio CM</option>
        <option value="3">Convenio de Pago CP</option>
        <option value="4">Convenio de Terminación CT</option>
        <option value="5">Términos Comerciales TC</option>
        <option value="6">Instrumentos Permuta/Comodato PC</option>
      </select>
    </div>

    <div class="form-group">
      <label for="businessName">Razón social <span class="required">*</span></label>
      <input type="text" id="businessName" name="businessName" required>
    </div>

    <div class="form-group">
      <label for="nomcom">Nombre Comercial <span class="required">*</span></label>
      <input type="text" id="nomcom" name="nomcom" required>
    </div>

    <div class="form-group">
      <label for="instrumento">CONCEPTO:<span class="required">*</span></label>
      <select id="instrumento" name="instrumento" required>
        <option value="">- Selecciona un instrumento -</option>
        <option value="1">HANGARES</option>
        <option value="2">ACCESO A ZONA FEDERAL</option>
        <option value="3">PLATAFORMA</option>
        <option value="4">INCENTIVOS</option>
        <option value="5">SERVICIOS AEROPORTUARIOS</option>
        <option value="6">TUA</option>
        <option value="7">REVISION / INSPECCIÓN DE EQUIPAJE DOCUMENTADO</option>
        <option value="8">OFICINAS</option>
        <option value="9">MÓDULOS</option>
        <option value="10">PENSIONES E.P.</option>
        <option value="11">MOSTRADORES</option>
        <option value="12">LOCALES</option>
        <option value="13">COMODATO DE OFICINAS</option>
        <option value="14">OTROS INGRESOS</option>
        <option value="15">ESPACIOS PUBLICITARIOS</option>
        <option value="16">COMODATO DE ESPACIOS</option>
        <option value="17">PERMUTA DE LOCAL</option>
        <option value="18">COMODATO DE TERRENOS</option>
        <option value="19">ALMACÉN</option>
      </select>
    </div>

    <div class="form-group">
      <label for="unidades">Unidades/Elementos/m2 <span class="required">*</span></label>
      <input type="number" id="unidades" name="unidades" required>
    </div>

    <!-- Fechas -->
    <div class="form-group">
      <label for="fecha-inicio" class="required-field">Fecha inicio de vigencia:</label>
      <input type="date" id="fecha-inicio">
      <label for="fecha-fin" class="required-field">Fecha de fin de vigencia :</label>
      <input type="date" id="fecha-fin">
      <div id="vigencia"></div>
      <div id="porvencer"></div>
      <div id="vencidos"></div>
      <div id="estatus"></div>
    </div>

    <div class="form-group">
      <label for="tarifa">Tarifa <span class="required">*</span></label>
      <input type="number" id="tarifa" name="tarifa" required>
    </div>

    <div class="form-group">
      <label for="alicuotas" class="required-field">Porcentaje energía eléctrica (%):</label>
      <input type="number" id="alicuotas" step="0.01" required>    
    </div>
    <div id="luzResultado"></div>

    <div class="form-group">
      <label for="mantenimientoFijo" class="required-field">Porcentaje para mantenimiento (%):</label>
      <input type="number" id="mantenimientoFijo" step="0.01" required>   
    </div>
    <div id="mantenimientoResultado"></div>

    <div class="form-group">
      <label for="aguaFijo" class="required-field">Porcentaje para agua (%):</label>
      <input type="number" id="aguaFijo" step="0.01" required>
    </div>
    <div id="aguaResultado"></div>

    <h3>SUBTOTAL:</h3> <div id="subtotal"></div>

    <div class="form-group">
      <label for="incentivo">Incentivo <span class="required">*</span></label>
      <input type="number" id="incentivo" name="incentivo" required>
    </div>

    <h3>CONTRAPRESTACIONES VARIABLES</h3>
    <div class="form-group">
      <label for="aguaVariable" class="required-field">Variable (%):</label>
      <input type="number" id="aguaVariable" step="0.01" required>
    </div>
    <div id="variableContrato"></div>

    <div class="form-group">
      <label for="penalizacionContrato" class="required-field">Penalización (%):</label>
      <input type="number" id="penalizacionContrato" step="0.01" required>
    </div>
    <div id="penalizacionResultado"></div>

    <!-- (Resto del formulario sin cambios excepto correos y campos normales) -->
    <div class="form-group">
      <label for="CORREO">Correo electrónico <span class="required">*</span></label>
      <input type="email" id="CORREO" name="CORREO" required>
       </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const datosUsuario = JSON.parse(localStorage.getItem("datosUsuario")) || {};

  console.log("Datos cargados desde localStorage:", datosUsuario);

  // Llenar los campos
  if (datosUsuario["CUENTA"]) {
    document.getElementById("CUENTA").value = datosUsuario["CUENTA"];
  }

  if (datosUsuario["RAZON SOCIAL"]) {
    document.getElementById("businessName").value = datosUsuario["RAZON SOCIAL"];
  }

  if (datosUsuario["CORREO"]) {
    document.getElementById("CORREO").value = datosUsuario["CORREO"];
  }
});
</script>
