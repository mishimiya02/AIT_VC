<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generar Recibo</title>

<body>
    <div class="form-card">
<label for="folioBuscar">Folio</label>
<input id="folioBuscar" type="text">

<button onclick="buscarPorFolio()">Buscar</button>

<label for="fecha">Fecha</label>
<input id="fecha" type="text">

<label for="emisor">Emisor</label>
<input id="emisor" type="text">

<label for="valor">Valor</label>
<input id="valor" type="text">

<label for="concepto">Concepto</label>
<input id="concepto" type="text">

<label for="placas">Placas</label>
<input id="placas" type="text">

<label for="operador">Operador</label>
<input id="operador" type="text">

<label for="fechaAcceso">Fecha acceso</label>
<input id="fechaAcceso" type="text">
    </div>


<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwLRmVdVjdRE7R9yneKltho-nq12M8hTx1xBttT1N88EOdnRTrAHgqdQeVJA_hiruuVaQ/exec";
function buscarPorFolio() {
  const folio = document.getElementById("folioBuscar").value;
  if (!folio) return alert("Ingresa un folio");

  fetch(`${WEB_APP_URL}?folio=${folio}`)
    .then(r => r.json())
    .then(res => {
      if (!res.ok) {
        alert(res.error);
        return;
      }

      const d = res.data;

      fecha.value = d.fecha || "";
      emisor.value = d.emisor || "";
      valor.value = d.valor || "";
      concepto.value = d.concepto || "";
      placas.value = d.placas || "";
      operador.value = d.operador || "";
      fechaAcceso.value = d.fechaAcceso || "";
    });
}

</script>


</body>
</html>
