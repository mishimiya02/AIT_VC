<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Consulta por Folio</title>
  <style>
    body { font-family: Arial; background:#f4f6f8; }
    .card { background:#fff; padding:20px; max-width:500px; margin:auto; border-radius:12px; }
    label { font-weight:bold; display:block; margin-top:10px; }
    input { width:100%; padding:8px; margin-top:5px; }
    button { margin-top:15px; padding:10px; width:100%; }
  </style>
</head>
<body>

<div class="card">
  <h2>Buscar por folio</h2>

  <label>Folio</label>
  <input id="folio" placeholder="Ej. 00012">

  <button onclick="buscar()">Buscar</button>

  <label>Fecha</label>
  <input id="fecha">

  <label>Emisor</label>
  <input id="emisor">

  <label>Valor</label>
  <input id="valor">

  <label>Concepto</label>
  <input id="concepto">

  <label>Placas</label>
  <input id="placas">

  <label>Operador</label>
  <input id="operador">

  <label>Fecha acceso</label>
  <input id="fechaAcceso">

  <label> Fecha y Hora acceso</label>
  <input id="horaAcceso">
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbyblEZun4EUftrzo-Nf4zySCsIfAu1MqYZGsIf7dOfG5llpFI_Es6P2L8WZ9dSGt-tnDg/exec";

function buscar() {
  const folio = document.getElementById("folio").value;

  fetch(`${URL}?folio=${encodeURIComponent(folio)}`)
    .then(res => res.json())
    .then(res => {
      if (!res.ok) {
        alert(res.error);
        return;
      }

      const d = res.data;
      fecha.value = d.fecha;
      emisor.value = d.emisor;
      valor.value = d.valor;
      concepto.value = d.concepto;
      placas.value = d.placas;
      operador.value = d.operador;
      fechaAcceso.value = d.fechaAcceso;
      horaAcceso.value = d.horaAcceso;
    })
    .catch(err => {
      console.error(err);
      alert("Error de conexión");
    });
}
</script>

</body>
</html>
