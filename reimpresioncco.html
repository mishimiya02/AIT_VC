<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reimprimir Recibo</title>

<style>
body {
  font-family: Arial, sans-serif;
}

/* ====== UI ====== */
#ui {
  margin-bottom: 15px;
}

/* ====== RECIBO ====== */
.hoja-media {
  width: 21.6cm;
  height: 13.97cm;
  padding: 10mm;
  border: 2px solid #003a7d;
  border-radius: 10px;
  box-sizing: border-box;
  display: none;
}

.titulo {
  text-align: right;
  font-size: 22px;
  font-weight: bold;
  color: #003a7d;
}

.info-empresa {
  font-size: 12px;
  margin-top: 5px;
}

.contenedor-derecha {
  position: absolute;
  top: 25mm;
  right: 15mm;
  width: 200px;
}

.fila-dato {
  display: flex;
  margin-bottom: 5px;
}

.label-der {
  width: 70px;
  font-weight: bold;
}

.caja-der {
  flex: 1;
  border: 1px solid #003a7d;
  padding: 3px;
  text-align: right;
}

.leyenda {
  color: red;
  font-weight: bold;
  text-align: right;
}

.cuadro {
  border: 1px solid #003a7d;
  border-radius: 8px;
  padding: 8px;
  font-size: 12px;
  margin-top: 35px;
}

.info-fila {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
}

/* ====== PRINT ====== */
@media print {

  body * {
    visibility: hidden;
  }

  #recibo, #recibo * {
    visibility: visible;
  }

  #recibo {
    position: absolute;
    left: 0;
    top: 0;
  }

  #ui {
    display: none;
  }

  @page {
    size: Letter;
    margin: 0;
  }
}

    /* RECIBO MEDIA HOJA */
    .hoja-media{
        width: 800px;
        height: 430px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        border: 3px solid #003a7d;
        margin: 40px auto;
        display: none; /* oculto */
        transform: scale(0.9);
    }

    .cuadro{
        border: 2px solid #003a7d;
        border-radius: 12px;
        padding: 12px;
        margin-top: 10px;
    }


    .mini{
        font-size: 12px; 
        line-height: 16px;
    }
/* Título centrado y más arriba (siempre en el centro horizontal) */
.hoja-media .titulo {
    position: absolute;
    right: 20px;       /* lo manda a la derecha */
    top: 12px;         /* controla qué tan arriba va */
    font-size: 30px;
    font-weight: 800;
    color: #003a7d;
    z-index: 4;
    text-align: right; /* asegura alineación correcta */
}


/* Info de la empresa a la izquierda (no afecta el flow del título) */
.hoja-media .info-empresa {
    margin-top: 55px; /* deja espacio para el título/logo */
    font-size: 16px;
    line-height: 16px;
    color: #003a7d;
}

/* Contenedor para las cajas de Folio y Monto */
.hoja-media .top-boxes {
    display: flex;
    gap: 40px;
    margin-top: 8px; /* ajusta el espacio entre la info y las cajas */
    align-items: flex-start;
}

/* Caja de folio: ancho fijo */
.hoja-media .folio-box {
    border:2px solid #003a7d;
    padding:6px 12px;
    font-size:22px;
    font-weight:bold;
    color:red;
    width:120px;
    text-align:center;
}

/* Caja de monto: puede ser más amplia */
.hoja-media .monto-box {
    border:2px solid #003a7d;
    padding:6px 12px;
    font-size:22px;
    font-weight:bold;
    width:220px;
    text-align:right;
}
.contenedor-derecha {
    position: absolute;
    right: 20px;
    top: 65px;       /* Ajusta esto si quieres subir/bajar todo el bloque */
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
}

.fila-dato {
    display: flex;
    align-items: center;
    gap: 8px;        /* separación entre la leyenda y la caja */
}

.label-der {
    font-weight: bold;
    font-size: 14px;
    color: #003a7d;
}

.caja-der {
    border: 2px solid #003a7d;
    padding: 6px 12px;
    font-size: 22px;
    font-weight: bold;
    min-width: 160px;
    text-align: center;
}
.leyenda {
    display: none;
    font-weight: bold;
}
@media print {
  .hoja-media {
    transform: none !important;
    margin: 0 !important;
  }
}
.hoja-media {
    position: relative;
}

</style>
</head>

<body>

<!-- ===== UI ===== -->
<div id="ui">
  Folio:
  <input type="text" id="folio">
  <button onclick="buscar()">Buscar</button>
</div>

<!-- ===== RECIBO ===== -->
<div class="hoja-media" id="recibo">

  <div class="titulo">RECIBO DE PAGO</div>

  <div class="info-empresa">
    <b>Empresa:</b> AMAIT<br>
    <b>RFC:</b> AMA0312196E5<br>
    <b>Dirección:</b> AEROPUERTO INTERNACIONAL DE TOLUCA<br>
    <b>Teléfono:</b> 722-279-2800
  </div>

  <div class="contenedor-derecha">
    <div class="fila-dato">
      <div class="label-der">FOLIO:</div>
      <div class="caja-der" id="r-folio"></div>
    </div>
    <div class="fila-dato">
      <div class="label-der">POR:</div>
      <div class="caja-der" id="r-monto"></div>
    </div>
    <div class="leyenda">COPIA CCO AMAIT</div>
  </div>

  <div class="cuadro">
    <div><b>RECIBO DE:</b> <span id="r-reciboDe"></span></div>
    <div><b>LA CANTIDAD DE:</b> $ <span id="r-monto2"></span></div>
    <br>
    <div><b>CANTIDAD EN LETRA:</b> <span id="r-cantidadLetra"></span></div>
    <br>
    <div><b>POR CONCEPTO DE:</b> <span id="r-concepto"></span></div>
  </div>

  <br>

  <div class="info-fila">
    <div><b>FECHA:</b> <span id="r-fecha"></span></div>
    <div><b>FECHA Y HORA DE ACCESO:</b> <span id="r-acceso"></span></div>
  </div>

  <br><br>

  <div class="info-fila">
    <div>RECIBÍ (NOMBRE Y FIRMA)</div>
    <div>SELLO DE CAJA AMAIT</div>
  </div>

  <br>
  <button onclick="window.print()">Imprimir</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwzhMmwcEfitVPaKoEZvcsix34g15-kfWQH_bnGlXx86HNKtpGfl_c0BR0iuvFL5qLkKg/exec";

function buscar() {
  const folio = document.getElementById("folio").value.trim();
  if (!folio) return alert("Ingresa un folio");

  fetch(`${API_URL}?folio=${encodeURIComponent(folio)}`)
    .then(r => r.json())
    .then(d => {
      if (d.error) return alert(d.error);

      const monto = Number(d.valor).toFixed(2);

      document.getElementById("r-folio").textContent = d.folio;
      document.getElementById("r-monto").textContent = "$ " + monto;
      document.getElementById("r-monto2").textContent = monto;
      document.getElementById("r-reciboDe").textContent = d.emisor;
      document.getElementById("r-concepto").textContent = d.concepto;
      document.getElementById("r-fecha").textContent = d.fecha;
      document.getElementById("r-acceso").textContent = d.registrado;
      document.getElementById("r-cantidadLetra").textContent =
        monto + " PESOS M.N.";

      document.getElementById("recibo").style.display = "block";
    });
}
</script>

</body>
</html>
