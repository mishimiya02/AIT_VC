<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reimprimir Recibo</title>

<style>
 
body {
  font-family: Arial, sans-serif;
}

/* ===== UI ===== */
#ui {
  margin-bottom: 15px;
}

/* ===== RECIBO ===== */
.hoja-media {
  width: 800px;
  height: 430px;
  background: white;
  padding: 35px;
  border-radius: 12px;
  border: 3px solid #003a7d;
  margin: 20px auto;
  position: relative;
  display: none;
  box-sizing: border-box;
}

/* LOGO */
.logo {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 140px;
}

/* TÍTULO */
.titulo {
  position: absolute;
  right: 20px;
  top: 12px;
  font-size: 30px;
  font-weight: 800;
  color: #003a7d;
  text-align: right;
}

/* INFO EMPRESA */
.info-empresa {
  margin-top: 55px;
  font-size: 16px;
  line-height: 16px;
  color: #003a7d;
}

/* CONTENEDOR DERECHO */
.contenedor-derecha {
  position: absolute;
  right: 35px;
  top: 70px;
  bottom: 44px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}

.fila-dato {
  display: flex;
  align-items: center;
  gap: 8px;
}

.label-der {
  font-weight: bold;
  font-size: 14px;
  color: #003a7d;
}

.caja-der {
  border: 2px solid #003a7d;
  padding: 6px 12px;
  font-size: 22px;
  font-weight: bold;
  min-width: 160px;
  text-align: center;
}

/* LEYENDAS */
.leyenda {
  font-size: 13px;
  font-weight: bold;
  color: red;
  text-align: right;
}
.leyendas {
  margin-top: 10px;   /* ⬅️ separa del folio */
  margin-bottom: 10px; /* ⬅️ separa del cuadro */
  text-align: right;
  padding-right: 35px; /* alinea con cajas */
}


/* CUADRO CENTRAL */
.cuadro {
  border: 2px solid #003a7d;
  border-radius: 12px;
 
  font-size: 12px;
  margin-top: 5px;
    padding: 0px 12px;  

}
.campo {
  margin-bottom: 10px;
}

.dato-linea {
  display: inline-block;
  min-width: 180px;           /* ancho de la línea */
  border-bottom: 2px solid #003a7d;
  padding-bottom: 2px;
  margin-left: 6px;
}

.dato-linea.largo {
  min-width: 320px;
}

.dato-linea.muy-largo {
  display: block;             /* concepto en renglón propio */
  margin-top: 6px;
  min-width: 100%;
}
.dato-linea.concepto {
  min-width: 100%;
  max-width: 100%;
  white-space: nowrap;        /* ⬅️ evita salto */
  overflow: hidden;
  text-overflow: ellipsis;    /* … si es muy largo */
}


/* FILAS INFERIORES */
.info-fila {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
}

/* ===== PRINT ===== */
@media print {

  body * {
    visibility: hidden;
  }

  #recibo,
  #recibo * {
    visibility: visible;
  }

  #recibo {
    position: absolute;
    top: 20mm;               /* ⬅️ mitad superior */
    left: 50%;
    transform: translateX(-50%) scale(1.4);
    transform-origin: top center;
    margin: 0;
  }

  #ui {
    display: none;
  }

  @page {
    size: Letter;
    margin: 0;
  }
}


</style>
</head>

<body>

<!-- ===== UI ===== -->
<div id="ui">
  Folio:
  <input type="text" id="folio">
  <button onclick="buscar()">Buscar</button>
  
 <button onclick="window.print()">Imprimir</button>
</div>

<!-- ===== RECIBO ===== -->
<div class="hoja-media" id="recibo">
<img src="img/logo2n.png" class="logo">

  <div class="titulo">RECIBO DE PAGO</div>

  <div class="info-empresa">
    <b>Empresa:</b> AMAIT<br>
    <b>RFC:</b> AMA0312196E5<br>
    <b>Dirección:</b> AEROPUERTO INTERNACIONAL DE TOLUCA<br>
    <b>Teléfono:</b> 722-279-2800
  </div>

  <div class="contenedor-derecha">
    <div class="fila-dato">
      <div class="label-der">FOLIO N°:</div>
      <div class="caja-der" id="r-folio"></div>
    </div>
    <div class="fila-dato">
      <div class="label-der">POR:</div>
      <div class="caja-der" id="r-monto"></div>
    </div>   
  </div>
 <div class="leyendas">
  <div class="leyenda">COPIA CCO AMAIT</div>
 <!-- <div class="leyenda">COPIA SEGURIDAD AMAIT</div> -->
</div>
<div class="cuadro">
<div class="campo">
  <b>RECIBO DE:</b>
  <span class="dato-linea" id="r-reciboDe"></span>
</div>

<div class="campo">
  <b>LA CANTIDAD DE:</b> $
  <span class="dato-linea corto" id="r-monto2"></span>
</div>

<div class="campo">
  <b>CANTIDAD EN LETRA:</b>
  <span class="dato-linea largo" id="r-cantidadLetra"></span>
</div>

<div class="campo">
  <b>POR CONCEPTO DE:</b>
  <span class="dato-linea muy-largo" id="r-concepto"></span>
</div>


  <br>

  <div class="info-fila">
    <div><b>FECHA:</b> <span id="r-fecha"></span></div>
    <div><b>FECHA Y HORA DE ACCESO:</b> <span id="r-acceso"></span></div>
  </div>

  <br><br>

  <div class="info-fila">
    <div>RECIBÍ (NOMBRE Y FIRMA)</div>
    <div>SELLO DE CAJA AMAIT</div>
  </div>

  <br>
 
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwzhMmwcEfitVPaKoEZvcsix34g15-kfWQH_bnGlXx86HNKtpGfl_c0BR0iuvFL5qLkKg/exec";

function buscar() {
  const folio = document.getElementById("folio").value.trim();
  if (!folio) return alert("Ingresa un folio");

  fetch(`${API_URL}?folio=${encodeURIComponent(folio)}`)
    .then(r => r.json())
    .then(d => {
      if (d.error) return alert(d.error);

      const monto = Number(d.valor).toFixed(2);

      document.getElementById("r-folio").textContent = d.folio;
      document.getElementById("r-monto").textContent = "$ " + monto;
      document.getElementById("r-monto2").textContent = monto;
      document.getElementById("r-reciboDe").textContent = d.emisor;
      document.getElementById("r-concepto").textContent = d.concepto;
      document.getElementById("r-fecha").textContent = d.fecha;
      document.getElementById("r-acceso").textContent = d.registrado;
      document.getElementById("r-cantidadLetra").textContent =
        monto + " PESOS M.N.";

      document.getElementById("recibo").style.display = "block";
    });
}
</script>

</body>
</html>
