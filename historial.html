    <div class="formulario">
<h2>Buscador por Área</h2>
<div class="input-group">

  <select id="area">
    <option value="">-- TODOS LOS REGISTROS --</option>
    <option value="DIRECCION DE OPERACIONES">DIRECCION DE OPERACIONES</option>
    <option value="DIRECCION DE ADMINISTRACION Y FINANZAS">DIRECCION DE ADMINISTRACION Y FINANZAS</option>
    <option value="DIRECCION JURIDICA">DIRECCION JURIDICA</option>
    <option value="DIRECCION GENERAL">DIRECCION GENERAL</option>
     <option value="DIRECCION COMERCIAL">DIRECCION COMERCIAL</option>
  </select>
<input type="text" id="fechaFiltro" placeholder="FORMATO OBLIGATORIO:2026-03-01">

  <button class="btn-buscar" onclick="buscar()">Buscar</button>
  <button class="btn-filtrado" onclick="descargarFiltrado()">⬇ Filtrado</button>
  <button class="btn-todo" onclick="descargarTodo()">⬇ Todo</button>

</div>
<div id="totalRegistros"></div>
<table id="tabla"></table>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  
const API_URL = "https://script.google.com/macros/s/AKfycbyn3IprMdisxxqsN6ihLQAh2CU1JS7BozMRLMuMpKasLjtHMQMNSX2KX5IPZqs01E5_/exec"; // 👈 tu /exec

let datosActuales = [];
let datosCompletos = [];
async function buscar() {

  const area = document.getElementById("area").value.trim();
  const fecha = document.getElementById("fechaFiltro").value.trim();

  let url = API_URL;
  const params = [];

  if (area) params.push("area=" + encodeURIComponent(area));
  if (fecha) params.push("fecha=" + encodeURIComponent(fecha));

  if (params.length > 0) {
    url += "?" + params.join("&");
  }

  // 🔥 MOSTRAR LOADING
  Swal.fire({
    title: "Buscando...",
    text: "Espera un momento",
    allowOutsideClick: false,
    didOpen: () => {
      Swal.showLoading();
    }
  });

  try {
    const res = await fetch(url);
    const datos = await res.json();

    datosActuales = datos;
    mostrarTabla(datos);

    const total = datos.length - 1;

    document.getElementById("totalRegistros").textContent =
      total > 0
        ? `Total: ${total} registro(s)`
        : "Sin registros";

    // ✅ CERRAR LOADING
    Swal.close();

  } catch (error) {
    Swal.fire("Error", "No se pudo realizar la búsqueda", "error");
    console.error(error);
  }
}

async function cargarTodo() {
  const res = await fetch(API_URL);
  const datos = await res.json();
  datosCompletos = datos;
}

function mostrarTabla(datos) {
  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  datos.forEach((fila, i) => {
    const tr = document.createElement("tr");

    fila.forEach(col => {
      const celda = document.createElement(i === 0 ? "th" : "td");
      celda.textContent = col;
      tr.appendChild(celda);
    });

    tabla.appendChild(tr);
  });
}

// 📥 Descargar C
function descargarExcel(datos, nombre) {
  if (!datos || datos.length === 0) {
    alert("No hay datos para descargar");
    return;
  }

  // Convertir arreglo a hoja
  const ws = XLSX.utils.aoa_to_sheet(datos);

  // Crear libro
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Datos");

  // Descargar archivo
  XLSX.writeFile(wb, nombre);
}
// 🔹 Descargar filtrado
function descargarFiltrado() {
  if (datosActuales.length === 0) {
    alert("Primero realiza una búsqueda");
    return;
  }

  descargarExcel(datosActuales, "filtrado.xlsx");
}
function descargarFiltrado() {
  if (datosActuales.length === 0) {
    alert("Primero realiza una búsqueda");
    return;
  }

  descargarExcel(datosActuales, "filtrado.xlsx");
}

// 🔹 Descargar todo
function descargarTodo() {
  if (datosCompletos.length === 0) {
    alert("Cargando datos...");
    cargarTodo().then(() => {
      descargarExcel(datosCompletos, "completo.xlsx");
    });
  } else {
    descargarExcel(datosCompletos, "completo.xlsx");
  }
}
// carga inicial
cargarTodo();
</script>
