<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Filtro por Tipo de Contrato</title>
</head>

<body>

<h2>Filtrar por Tipo de Contrato</h2>
<select id="tipo" onchange="filtrar()">
  <option value="">-- Todos --</option>
</select>

<table id="tabla" border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Núm. Cliente</th>
      <th>Núm. DCT SAP</th>
      <th>Núm. Contrato</th>
      <th>Tipo Contrato</th>
      <th>Concepto</th>
      <th>Fecha Fin</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const SPREADSHEET_ID = "1cGJk_Dg2DjT9h2_cH1ScQ5cgCxlPtg2eQXQIzPv79gk";
const SHEET_NAME = "contratos";
const API_KEY = "AIzaSyBE2QwI6eIPWB1unm7nsLX-oqNB26veBsQ";

async function getData() {
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${SHEET_NAME}?key=${API_KEY}`);
  const json = await res.json();
  const rows = json.values.slice(1); // Ignorar cabecera
  return rows.map(r => ({
  id: r[0],           // Columna A
  numCliente: r[1],   // Columna B
  numDctSap: r[2],    // Columna C
  numContrato: r[3],  // Columna D
  tipoContrato: r[5], // Columna F CORRECTA
  concepto: r[8],     // Columna I
  fechaFin: r[12]     // Columna M, si aplica
}));

}

async function cargarTipos() {
  const data = await getData();
  const tipos = [...new Set(data.map(r => r.tipoContrato))];
  const select = document.getElementById("tipo");
  tipos.forEach(t => select.innerHTML += `<option value="${t}">${t}</option>`);
}

async function filtrar() {
  const tipo = document.getElementById("tipo").value;
  const data = await getData();
  const filtrado = tipo ? data.filter(r => r.tipoContrato === tipo) : data;
  mostrar(filtrado);
}

function mostrar(data) {
  const tbody = document.querySelector("#tabla tbody");
  tbody.innerHTML = "";
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Sin resultados</td></tr>`;
    return;
  }
  data.forEach(r => {
    tbody.innerHTML += `<tr>
      <td>${r.id}</td>
      <td>${r.numCliente}</td>
      <td>${r.numDctSap}</td>
      <td>${r.numContrato}</td>
      <td>${r.tipoContrato}</td>
      <td>${r.concepto}</td>
      <td>${r.fechaFin}</td>
    </tr>`;
  });
}

// Inicializar
cargarTipos().then(filtrar);
</script>
</body>
</html>
