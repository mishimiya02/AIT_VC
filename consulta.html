<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtro de Contratos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="mb-4 text-center">FILTRAR CONTRATOS</h2>

  <!-- FILTROS -->
  <div class="card p-4 shadow-sm mb-4">
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label fw-bold">Tipo de Contrato</label>
        <select id="tipo" class="form-select" onchange="filtrar()">
          <option value="">-- Todos --</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label fw-bold">Concepto</label>
        <input id="concepto" class="form-control" placeholder="Buscar concepto..." oninput="filtrar()">
      </div>

      <div class="col-md-3">
        <label class="form-label fw-bold">Estatus Facturación</label>
        <select id="estatusAW" class="form-select" onchange="filtrar()">
          <option value="">-- Todos --</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label fw-bold">Estatus AZ</label>
        <select id="estatusAZ" class="form-select" onchange="filtrar()">
          <option value="">-- Todos --</option>
        </select>
      </div>
    </div>
  </div>

  <!-- TABLA -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-3">Resultados</h4>
      <p id="contador" class="fw-bold">Total de registros: 0</p>
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Núm. Cliente</th>
              <th>Núm. DCT SAP</th>
              <th>Núm. Contrato</th>
              <th>Tipo Contrato</th>
              <th>Concepto</th>
              <th>Fecha Fin</th>
               <th>Tarifa Q</th>
              <th>Estatus Facturación</th>
              <th>Estatus AZ</th>
            </tr>
          </thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const SPREADSHEET_ID = "1cGJk_Dg2DjT9h2_cH1ScQ5cgCxlPtg2eQXQIzPv79gk";
const SHEET_NAME = "contratos";
const API_KEY = "AIzaSyBE2QwI6eIPWB1unm7nsLX-oqNB26veBsQ";

// Obtener datos de Google Sheets
async function getData() {
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${SHEET_NAME}?key=${API_KEY}`);
  const json = await res.json();
  const rows = json.values.slice(1); // Ignorar cabecera
  return rows.map(r => ({
    id: r[0],
    numCliente: r[1],
    numDctSap: r[2],
    numContrato: r[3],
    tipoContrato: r[5],  // Columna F
    concepto: r[8],      // Columna I
    fechaFin: r[12],     // Columna M
      tarifaQ: r[16] || "", // Q
    estatusAW: r[48] || "", // Columna AW
    estatusAZ: r[51] || ""  // Columna AZ
  }));
}

// Mostrar datos en tabla
function mostrar(data) {
  const tbody = document.getElementById("tabla");
  const contador = document.getElementById("contador");
  tbody.innerHTML = "";

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;">Sin resultados</td></tr>`;
    contador.textContent = "Total de registros: 0";
    return;
  }

  data.forEach(r => {
    tbody.innerHTML += `<tr>
      <td>${r.id}</td>
      <td>${r.numCliente}</td>
      <td>${r.numDctSap}</td>
      <td>${r.numContrato}</td>
      <td>${r.tipoContrato}</td>
      <td>${r.concepto}</td>
      <td>${r.fechaFin}</td>
        <td>${r.tarifaQ}</td>
      <td>${r.estatusAW}</td>
      <td>${r.estatusAZ}</td>
    </tr>`;
  });

  contador.textContent = `Total de registros: ${data.length}`;
}

// Cargar filtros dinámicos
async function cargarFiltros() {
  const data = await getData();

  // Tipo de Contrato
  const tipos = [...new Set(data.map(r => r.tipoContrato).filter(Boolean))];
  const selectTipo = document.getElementById("tipo");
  tipos.forEach(t => selectTipo.innerHTML += `<option value="${t}">${t}</option>`);

  // Estatus Facturación AW
  const estAW = [...new Set(data.map(r => r.estatusAW).filter(Boolean))];
  const selectAW = document.getElementById("estatusAW");
  estAW.forEach(e => selectAW.innerHTML += `<option value="${e}">${e}</option>`);

  // Estatus AZ
  const estAZ = [...new Set(data.map(r => r.estatusAZ).filter(Boolean))];
  const selectAZ = document.getElementById("estatusAZ");
  estAZ.forEach(e => selectAZ.innerHTML += `<option value="${e}">${e}</option>`);
}

// Filtrar datos según selección
async function filtrar() {
  const tipo = document.getElementById("tipo").value;
  const concepto = document.getElementById("concepto").value.toLowerCase();
  const estatusAW = document.getElementById("estatusAW").value;
  const estatusAZ = document.getElementById("estatusAZ").value;

  const data = await getData();

  const filtrado = data.filter(r => {
    let ok = true;
    if (tipo) ok = ok && r.tipoContrato === tipo;
    if (concepto) ok = ok && r.concepto.toLowerCase().includes(concepto);
    if (estatusAW) ok = ok && r.estatusAW === estatusAW;
    if (estatusAZ) ok = ok && r.estatusAZ === estatusAZ;
    return ok;
  });

  mostrar(filtrado);
}

// Inicialización
cargarFiltros().then(filtrar);
</script>

</body>
</html>
