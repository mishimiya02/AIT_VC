<div class="container">
    <h2>REGISTRO DE CONTRATO Y FACTURACIÓN</h2>
    
    <form id="formContrato">
        
        <fieldset>
            <legend>Identificación y Cliente</legend>
            <div class="field">
                <label>ID</label>
                <input type="text" name="id">
            </div>
            <div class="field">
                <label>No. Cliente</label>
                <input type="text" name="no_cliente">
            </div>
            <div class="field">
                <label>No. Dcto SAP</label>
                <input type="text" name="dcto_sap">
            </div>
            <div class="field">
                <label>No. Contrato</label>
                <input type="text" name="no_contrato">
            </div>
            <div class="field">
                <label>Tipo Contrato</label>
                <select name="tipo_contrato">
                    <option value="Arrendamiento">Arrendamiento</option>
                    <option value="Servicios">Servicios</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div class="field">
                <label>Razón Social</label>
                <input type="text" name="razon_social">
            </div>
            <div class="field">
                <label>Nombre Comercial</label>
                <input type="text" name="nombre_comercial">
            </div>
        </fieldset>

        <fieldset>
            <legend>Detalles del Concepto</legend>
            <div class="field full-width">
                <label>Concepto / Objeto</label>
                <input type="text" name="concepto_objeto">
            </div>
            <div class="field">
                <label>Unidades / Elementos / M2</label>
                <input type="number" step="0.01" name="unidades">
            </div>
            <div class="field">
                <label>Tarifa x Unidad</label>
                <input type="number" step="0.01" name="tarifa_unidades">
            </div>
            <div class="field">
                <label>Subtotal</label>
                <input type="number" step="0.01" name="subtotal">
            </div>
            <div class="field">
                <label>Total</label>
                <input type="number" step="0.01" name="total">
            </div>
        </fieldset>

        <fieldset>
            <legend>Vigencia y Estatus</legend>
            <div class="field">
                <label>Inicio Vigencia</label>
                <input type="date" name="inicio_vigencia">
            </div>
            <div class="field">
                <label>Fin Vigencia</label>
                <input type="date" name="fin_vigencia">
            </div>
            <div class="field">
                <label>Días por Vencer</label>
                <input type="number" name="dias_x_vencer" readonly>
            </div>
            <div class="field">
                <label>Días Vencidos</label>
                <input type="number" name="dias_vencidos" readonly>
            </div>
            <div class="field">
                <label>Estatus Vigencia</label>
                <input type="text" name="estatus_vigencia">
            </div>
            <div class="field">
                <label>Vigencia (Días)</label>
                <input type="number" name="vigencia_total">
            </div>
            <div class="field">
                <label>Tipo Vigencia</label>
                <input type="text" name="tipo_vigencia">
            </div>
        </fieldset>

        <fieldset>
            <legend>Costos Adicionales e Incentivos</legend>
            <div class="field"><label>% Mtto</label><input type="number" step="0.01" name="p_mtto"></div>
            <div class="field"><label>$ Mtto</label><input type="number" step="0.01" name="monto_mtto"></div>
            <div class="field"><label>% Luz</label><input type="number" step="0.01" name="p_luz"></div>
            <div class="field"><label>% Agua</label><input type="number" step="0.01" name="p_agua"></div>
            <div class="field"><label>$ Agua</label><input type="number" step="0.01" name="monto_agua"></div>
            <div class="field"><label>% Incentivo</label><input type="number" step="0.01" name="p_incentivo"></div>
            <div class="field"><label>% Variable</label><input type="number" step="0.01" name="p_variable"></div>
            <div class="field"><label>% Penalización</label><input type="number" step="0.01" name="p_penalizacion"></div>
        </fieldset>

        <fieldset>
            <legend>Actualización y Garantías</legend>
            <div class="field"><label>Premisa</label><input type="text" name="premisa"></div>
            <div class="field"><label>Base de Premisa</label><input type="text" name="base_premisa"></div>
            <div class="field"><label>Periodicidad</label><input type="text" name="periodicidad"></div>
            <div class="field"><label>Próxima Fecha Actualización</label><input type="date" name="prox_actualizacion"></div>
            <div class="field"><label>Comunicado</label><input type="text" name="comunicado"></div>
            <div class="field"><label>Días de Crédito</label><input type="number" name="dias_credito"></div>
            <div class="field"><label>Garantía</label><input type="text" name="garantia"></div>
            <div class="field"><label>Monto Garantía</label><input type="number" step="0.01" name="monto_garantia"></div>
        </fieldset>

            <div class="field full-width"><label>Detalle de Ubicación</label><textarea name="detalle_ubicacion"></textarea></div>
            <div class="field"><label>Correo Electrónico SAP</label><input type="email" name="email_sap"></div>
            <div class="field"><label>Enlace</label><input type="url" name="enlace"></div>
            <div class="field"><label>Estatus Facturación</label><select name="estatus_facturacion">
                <option value="Pendiente">Pendiente</option>
                <option value="Facturado">Facturado</option>
                <option value="Cancelado">Cancelado</option>
            </select></div>
        </fieldset>

        <button type="submit" class="btn-submit">GUARDAR DATOS EN GOOGLE SHEETS</button>
    </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // 1. Guardamos la URL que te dio SheetDB
const MI_API_URL = "https://sheetdb.io/api/v1/ide0kfsk1dap0"; 

const formContrato = document.getElementById('formContrato');

formContrato.addEventListener('submit', async (e) => {
    e.preventDefault(); // Evita que la página se recargue

    // 2. Mostrar mensaje de "Guardando..." con SweetAlert2
    Swal.fire({
        title: 'Guardando datos...',
        text: 'Por favor espera un momento',
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    // 3. Capturar todos los datos del formulario automáticamente
    const formData = new FormData(formContrato);
    const datosParaEnviar = Object.fromEntries(formData.entries());

    try {
        // 4. Enviar los datos a SheetDB mediante una petición POST
        const respuesta = await fetch(MI_API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                data: [datosParaEnviar] // SheetDB espera un arreglo de objetos
            })
        });

        const resultado = await respuesta.json();

        // 5. Si se creó con éxito (SheetDB devuelve 'created': 1)
        if (resultado.created === 1) {
            Swal.fire({
                icon: 'success',
                title: '¡Éxito!',
                text: 'Los datos se han guardado en Google Sheets.',
                confirmButtonColor: '#2149ff'
            });
            formContrato.reset(); // Limpia el formulario para un nuevo registro
        } else {
            throw new Error("No se pudo guardar");
        }

    } catch (error) {
        console.error("Error:", error);
        Swal.fire({
            icon: 'error',
            title: 'Hubo un problema',
            text: 'No pudimos conectar con la base de datos.',
            confirmButtonColor: '#75a0ff'
        });
    }
});
</script>
