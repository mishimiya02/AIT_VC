<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // 1. Guardamos la URL que te dio SheetDB
const MI_API_URL = "https://script.google.com/macros/s/AKfycbxZzAcVUE5r6EJrzYS8ladyIzjWux5IZYxgQssHpzVsO8pXue0EFxn9AiPJycEim8xFrw/exec"; 



async function generarIdAutomatico() {
    try {
        const response = await fetch(MI_API_URL);
        const data = await response.json();

        let nuevoNumero = 1;

        if (data.length > 0) {
            const ultimoRegistro = data[data.length - 1];
            const ultimoId = ultimoRegistro.id;

            if (ultimoId && ultimoId.startsWith("AIT")) {
                const numero = parseInt(ultimoId.replace("AIT", ""));
                nuevoNumero = numero + 1;
            }
        }

        const numeroFormateado = String(nuevoNumero).padStart(5, "0");
        const idFinal = "AIT" + numeroFormateado;

        document.getElementById('id').value = idFinal;

    } catch (error) {
        console.error("Error generando ID:", error);
        document.getElementById('id').value = "AIT00001";
    }
}

window.addEventListener("DOMContentLoaded", () => {
    generarIdAutomatico();
});










const formContrato = document.getElementById('formContrato');
formContrato.addEventListener('submit', async (e) => {
    e.preventDefault();

    Swal.fire({
        title: 'Guardando datos...',
        text: 'Por favor espera un momento',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });

    const formData = new FormData(formContrato);
    const datosParaEnviar = Object.fromEntries(formData.entries());

    try {
        const respuesta = await fetch(MI_API_URL, {
            method: 'POST',
            body: JSON.stringify({
                data: datosParaEnviar
            })
        });

        const resultado = await respuesta.json();

        if (resultado.result === "success") {

            Swal.fire({
                icon: 'success',
                title: '¡Éxito!',
                text: 'Los datos se han guardado correctamente.',
                confirmButtonColor: '#2149ff'
            });

            formContrato.reset();

        } else {
            throw new Error("No se pudo guardar");
        }

    } catch (error) {
        console.error("Error:", error);
        Swal.fire({
            icon: 'error',
            title: 'Hubo un problema',
            text: 'No pudimos conectar con la base de datos.',
            confirmButtonColor: '#75a0ff'
        });
    }
});

</script>
