<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // 1. Guardamos la URL que te dio SheetDB
const MI_API_URL = "https://script.google.com/macros/s/AKfycbwlWhREhsqiyUI_Pjr-wf-CM7GGN6ezA41wT_108ai-nTXiYK1GDkYciGGP4BNAkKIjnQ/exec"; 


async function generarIdAutomatico() {
    
    try {
        const response = await fetch(MI_API_URL + "?accion=ultimoId");
        const data = await response.json();

        let nuevoNumero = 1;

        if (data.ultimoId && data.ultimoId.startsWith("AIT")) {
            const numero = parseInt(data.ultimoId.replace("AIT", ""));
            nuevoNumero = numero + 1;
        }

        const numeroFormateado = String(nuevoNumero).padStart(5, "0");
        const idFinal = "AIT" + numeroFormateado;

        document.getElementById('id').value = idFinal;

    } catch (error) {
        console.error("Error generando ID:", error);
        document.getElementById('id').value = "AIT00001";
    }
    
}
window.addEventListener("DOMContentLoaded", () => {
    generarIdAutomatico();
});





const formContrato = document.getElementById('formContrato');
formContrato.addEventListener('submit', async (e) => {
    e.preventDefault();

    Swal.fire({
        title: 'Guardando datos...',
        text: 'Por favor espera un momento',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });

    const formData = new FormData(formContrato);
    const datosParaEnviar = Object.fromEntries(formData.entries());

    try {
        const respuesta = await fetch(MI_API_URL, {
            method: 'POST',
            body: JSON.stringify({
                data: datosParaEnviar
            })
        });

        const resultado = await respuesta.json();

     if (resultado.result === "success") {

    Swal.fire({
        icon: 'success',
        title: '¡Éxito!',
        text: 'Los datos se han guardado correctamente.',
        confirmButtonColor: '#2149ff'
    });

    formContrato.reset();

    // 🔥 Generar nuevo ID automáticamente
    generarIdAutomatico();



        } else {
            throw new Error("No se pudo guardar");
        }

    } catch (error) {
        console.error("Error:", error);
        Swal.fire({
            icon: 'error',
            title: 'Hubo un problema',
            text: 'No pudimos conectar con la base de datos.',
            confirmButtonColor: '#75a0ff'
        });
    }
});



///////////////////////****EMPIEZAN OPERACIONES ARITMÉTICAS PARA CALCULAR CAMPOS****///////////////////////
// Obtener referencias
const inputUnidades = document.querySelector('[name="unidades_m2"]');
const inputTarifaUnidad = document.querySelector('[name="tarifa_unidades"]');
const inputTarifa = document.querySelector('[name="tarifa"]');

function calcularTarifa() {
    const unidades = parseFloat(inputUnidades.value) || 0;
    const tarifaUnidad = parseFloat(inputTarifaUnidad.value) || 0;

    const resultado = unidades * tarifaUnidad;

    inputTarifa.value = resultado.toFixed(2);
}

// Escuchar cambios en ambos campos
inputUnidades.addEventListener("input", calcularTarifa);
inputTarifaUnidad.addEventListener("input", calcularTarifa);


const inputInicio = document.querySelector('[name="inicio_vigencia"]');
const inputFin = document.querySelector('[name="fin_vigencia"]');
const inputDiasVencer = document.querySelector('[name="dias_vencer"]');
const inputDiasVencidos = document.querySelector('[name="dias_vencidos"]');
const inputEstatus = document.querySelector('[name="estatus_vigencia"]');
const inputDiasVigencia = document.querySelector('[name="dias_vigencia"]');
const inputTipoVigencia = document.querySelector('[name="tipo_vigencia"]');

function calcularVigenciaCompleta() {

    if (!inputInicio.value || !inputFin.value) {
        inputDiasVencer.value = "";
        inputDiasVencidos.value = "";
        inputEstatus.value = "";
        inputDiasVigencia.value = "";
        inputTipoVigencia.value = "";
        return;
    }

    const hoy = new Date();
    hoy.setHours(0,0,0,0);

    const fechaInicio = new Date(inputInicio.value + "T00:00:00");
    const fechaFin = new Date(inputFin.value + "T00:00:00");

    // 🔹 DÍAS TOTALES DE VIGENCIA
    const totalMs = fechaFin - fechaInicio;
    const totalDias = Math.ceil(totalMs / (1000 * 60 * 60 * 24));
    inputDiasVigencia.value = totalDias > 0 ? totalDias : 0;

    // 🔹 DÍAS POR VENCER / VENCIDOS
    const diferenciaMs = fechaFin - hoy;
    const dias = Math.ceil(diferenciaMs / (1000 * 60 * 60 * 24));

    if (dias >= 0) {
        inputDiasVencer.value = dias;
        inputDiasVencidos.value = 0;

        if (dias <= 30) {
            inputEstatus.value = "POR VENCER";
        } else {
            inputEstatus.value = "ACTIVO";
        }

    } else {
        inputDiasVencer.value = 0;
        inputDiasVencidos.value = Math.abs(dias);
        inputEstatus.value = "VENCIDO";
    }

    // 🔹 TIPO DE VIGENCIA
    // 🔹 TIPO DE VIGENCIA (nueva lógica)
if (totalDias > 365) {
    inputTipoVigencia.value = "MULTIANUAL";
} else {
    inputTipoVigencia.value = "ANUAL";
}

}

// Escuchar cambios
inputInicio.addEventListener("change", calcularVigenciaCompleta);
inputFin.addEventListener("change", calcularVigenciaCompleta);

// Ejecutar al cargar
window.addEventListener("DOMContentLoaded", calcularVigenciaCompleta);

</script>
