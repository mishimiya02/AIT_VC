        <h1>CÉDULA DE DETERMINACIÓN DEL MONTO A GARANTIZAR</h1>
 
    
    <div class="form-container">
        
<input type="file" id="fileInput" accept="application/pdf">
<button id="cancelar">Marcar como Cancelado</button>

    </div>


    <script type="module">
import { PDFDocument, rgb, StandardFonts, degrees } from 'https://cdn.skypack.dev/pdf-lib';

document.getElementById('cancelar').addEventListener('click', async () => {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return alert("Selecciona un PDF primero");

  const file = fileInput.files[0];
  const arrayBuffer = await file.arrayBuffer();
  const pdfDoc = await PDFDocument.load(arrayBuffer);
  const pages = pdfDoc.getPages();
  const firstPage = pages[0];

  const { width, height } = firstPage.getSize();
  const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

  // 🟥 Escribimos la leyenda "CANCELADO" en diagonal
  firstPage.drawText('CANCELADO', {
    x: width / 4,
    y: height / 4,
    size: 90,
    font,
    color: rgb(1, 0, 0),
    rotate: degrees(45),
  });

  // 🧠 Obtener el nombre original y agregar "_CANCELADO"
  const originalName = file.name.replace(/\.pdf$/i, ""); // quita la extensión .pdf si existe
  const newFileName = `${originalName}_CANCELADO.pdf`;

  // Guardar PDF modificado
  const pdfBytes = await pdfDoc.save();
  const blob = new Blob([pdfBytes], { type: 'application/pdf' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = newFileName; // usa el nuevo nombre dinámico
  link.click();
});
</script>
