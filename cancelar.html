        <h1>CANCELAR COMPROBANTES </h1>
 
    
    <div class="form-container">
        
<input type="file" id="fileInput" accept="application/pdf">
<button id="cancelar">Marcar como Cancelado</button>
  <div class="form-group">
      <label for="fecha"> FECHA DE CANCELACIÓN:</label>
      <input type="date" id="fecha" name="fecha">    
    </div>
   <div class="form-group">
      <label for="observaciones"> MOTIVO DE CANCELACIÓN:</label>
      <input type="text" id="observaciones" name="observaciones">    
    </div>

<div class="form-group">
    <label>COLOR DE MARCA DE AGUA</label>
    <div class="radio-group">
        <label>
            <input type="radio" id="colorRojo" name="color" value="rojo" checked> Rojo
        </label>
        <label>
            <input type="radio" id="colorNegro" name="color" value="negro"> Negro
        </label>
    </div>
</div>


    </div>

<script type="module">
import { PDFDocument, rgb, StandardFonts, degrees } from 'https://cdn.skypack.dev/pdf-lib';

// Tu función para generar la cadena 
function generarCadenaOriginal() {
    const caracteres = 'abcdeefghijklnmopqrstuvwxyz234567890/*$#!?¡¿+';
    let cadena = '//20.02AITcxcYAL';
    
    for (let i = 0; i < 99; i++) {
        cadena += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
    }
    
    cadena += 'ine||';
    return cadena;
}

document.getElementById('cancelar').addEventListener('click', async () => {
  const fileInput = document.getElementById('fileInput');
  const fechaInput = document.getElementById('fecha').value;
  const motivoInput = document.getElementById('observaciones').value;

  if (!fileInput.files.length) return alert("Selecciona un PDF.");
  if (!fechaInput) return alert("Por favor ingresa la fecha de cancelación.");
  if (!motivoInput.trim()) return alert("Por favor ingresa el motivo de cancelación.");

  const file = fileInput.files[0];
  const arrayBuffer = await file.arrayBuffer();
  const pdfDoc = await PDFDocument.load(arrayBuffer);
  const pages = pdfDoc.getPages();
  const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

  // 🔴 Propiedades visuales del patrón
const colorSeleccionado = document.querySelector('input[name="color"]:checked');
const colorMarca = colorSeleccionado.value === 'rojo' ? rgb(0.9, 0.1, 0.1) : rgb(0.0, 0.0, 0.0);

  const transparencia = 0.5;
  const textoMarca = 'CANCELADO';

  // 🟥 Función para crear patrón en toda la página
  const crearPatronMarcaAgua = (page) => {
    const { width, height } = page.getSize();
    
    const tamanoTexto = 40;
    const espacioHorizontal = tamanoTexto * 6;
    const espacioVertical = tamanoTexto * 3.5;
    const angulo = degrees(45);
    
    const columnas = Math.ceil(width / espacioHorizontal) + 2;
    const filas = Math.ceil(height / espacioVertical) + 2;
    
    for (let fila = -1; fila <= filas; fila++) {
      for (let columna = -1; columna <= columnas; columna++) {
        const x = columna * espacioHorizontal;
        const y = fila * espacioVertical;
        
       page.drawText(textoMarca, {
    x: x,
    y: y,
    size: tamanoTexto,
    font: font,
    color: colorMarca, // ← Cambia esta línea
    rotate: angulo,
    opacity: transparencia
});
      }
    }
  };

  // 📄 Aplicar a todas las páginas
  for (const page of pages) {
    const { width, height } = page.getSize();
    
    // Crear patrón de fondo
    crearPatronMarcaAgua(page);

    // ✅ Generar y agregar la cadena original
    const cadenaOriginal = generarCadenaOriginal();
    
    // Agregar cadena en posición discreta (por ejemplo, muy pequeña y en esquina)
    page.drawText(`AUT: ${cadenaOriginal}`, {
      x: 30,
      y: 180, // Muy abajo
      size: 8, // Muy pequeño
      font: font,
      color: rgb(0.3, 0.3, 0.3), // Gris discreto
      opacity: 1 // Semi-transparente
    });

    // Información de cancelación en pie de página
    page.drawText(`FECHA DE CANCELACIÓN: ${fechaInput}`, {
      x: 30,
      y: 200,
      size: 8,
      font: font,
      color: rgb(0, 0, 0),
      opacity: 0.8
    });

    page.drawText(`MOTIVO: ${motivoInput}`, {
      x: 30,
      y: 190,
      size: 8,
      font: font,
      color: rgb(0, 0, 0),
      opacity: 0.8
    });
  }

  // 💾 Guardar PDF
  const originalName = file.name.replace(/\.pdf$/i, "");
  const newFileName = `${originalName}_CANCELADO.pdf`;
  const pdfBytes = await pdfDoc.save();
  const blob = new Blob([pdfBytes], { type: 'application/pdf' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = newFileName;
  link.click();
});
</script>
