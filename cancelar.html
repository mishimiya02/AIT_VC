<!-- Carga PDF-LIB desde CDN clásico -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>

// 🔢 Limitar el motivo a 40 caracteres en tiempo real
const motivoInputField = document.getElementById('observaciones');

motivoInputField.addEventListener('input', (e) => {
  let valor = e.target.value;

  // Si supera los 40 caracteres, recortar y mostrar alerta visual
  if (valor.length > 40) {
    e.target.value = valor.substring(0, 40);
    // Mostrar alerta no intrusiva
    if (!document.getElementById('motivoWarning')) {
      const aviso = document.createElement('div');
      aviso.id = 'motivoWarning';
      aviso.textContent = '⚠️ Máximo 40 caracteres permitidos';
      aviso.style.color = 'red';
      aviso.style.fontSize = '12px';
      aviso.style.marginTop = '4px';
      e.target.parentNode.appendChild(aviso);
    }
  } else {
    // Eliminar mensaje si el texto vuelve a estar dentro del límite
    const aviso = document.getElementById('motivoWarning');
    if (aviso) aviso.remove();
  }
});



const { PDFDocument, rgb, StandardFonts, degrees } = PDFLib;

// 🔐 Claves registradas válidas
const registeredKeys = ['JM',  'RMV', 'AIT'];

function validarClave(clave) {
  if (!clave) return false;
  return registeredKeys.includes(clave.toUpperCase());
}

function generarCadenaOriginal(clave) {
  const caracteres = 'abcdeefghijklnmopqrstuvwxyz234567890/*$#!?¡¿+';
  let cadena = `//20.02AITcxcYAL${clave}`;
  for (let i = 0; i < 99; i++) {
    cadena += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
  }
  cadena += 'ine||';
  return cadena;
}

// 🔠 Forzar mayúsculas y limitar a 2 caracteres
const claveInput = document.getElementById('clave');

claveInput.addEventListener('input', (e) => {
  let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (v.length > 3) v = v.substring(0, 3);
  e.target.value = v;
});


document.getElementById('cancelar').addEventListener('click', async () => {
  const fileInput = document.getElementById('fileInput');
  const fechaInput = document.getElementById('fecha').value;
  const motivoInput = document.getElementById('observaciones').value;
  const clave = document.getElementById('clave').value.trim().toUpperCase();

  if (!fileInput.files.length) return alert("Selecciona un PDF.");
  if (!fechaInput) return alert("Por favor ingresa la fecha de cancelación.");
  if (!motivoInput.trim()) return alert("Por favor ingresa el motivo de cancelación.");
  if (!clave || clave.length < 2 || clave.length > 3) {alert("La clave debe tener 2 o 3 caracteres."); return;}


  if (!validarClave(clave)) return alert("Clave NO registrada. No se puede generar el archivo.");

  const file = fileInput.files[0];
  const arrayBuffer = await file.arrayBuffer();
  const pdfDoc = await PDFDocument.load(arrayBuffer);
  const pages = pdfDoc.getPages();
  const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

  // ⚙️ Configuración de color y marca
  const colorSeleccionado = document.querySelector('input[name=\"color\"]:checked');
  const colorMarca = colorSeleccionado.value === 'rojo' ? rgb(0.9, 0.1, 0.1) : rgb(0, 0, 0);
  const transparencia = 0.2;
  const textoMarca = 'CANCELADO';

  // 💧 Marca de agua diagonal
  const crearPatronMarcaAgua = (page) => {
    const { width, height } = page.getSize();
    const tamanoTexto = 40;
    const espacioHorizontal = tamanoTexto * 6;
    const espacioVertical = tamanoTexto * 3.5;
    const angulo = degrees(45);
    const columnas = Math.ceil(width / espacioHorizontal) + 2;
    const filas = Math.ceil(height / espacioVertical) + 2;

    for (let fila = -1; fila <= filas; fila++) {
      for (let columna = -1; columna <= columnas; columna++) {
        const x = columna * espacioHorizontal;
        const y = fila * espacioVertical;
        page.drawText(textoMarca, {
          x,
          y,
          size: tamanoTexto,
          font,
          color: colorMarca,
          rotate: angulo,
          opacity: transparencia
        });
      }
    }
  };

  // 🧾 Dibujar datos de cancelación y cadena
 // 🧾 Dibujar datos de cancelación y cadena con fondo rectangular
// 🧾 Dibujar datos de cancelación y cadena con fondo rectangular
for (const page of pages) {
  crearPatronMarcaAgua(page);

  const cadenaOriginal = generarCadenaOriginal(clave);
  const cadenaParte1 = cadenaOriginal.substring(0, 50);
  const cadenaParte2 = cadenaOriginal.substring(50);

  // 📝 Coordenadas ajustadas hacia la IZQUIERDA
  const xBase = 135; // 🔹 REDUCIDO de 200 a 100 (más a la izquierda) FECHA
  const xparte2 = 135  // 🔹 REDUCIDO de 135 a 35 (más a la izquierda) CADENA
  const xparte1 = 135;  // 🔹 REDUCIDO de 180 a 80 (más a la izquierda)
  const yBase = 200; // 🔹 Mantenemos la misma altura

  // 🔹 Dimensiones del fondo rectangular
  const rectWidth = 355; // Ancho del rectángulo
  const rectHeight = 60; // Altura del rectángulo
  const rectX = xBase - 10; // Posición X del rectángulo (ajustada para centrar)
  const rectY = yBase - 40; // Posición Y del rectángulo (ajustada para centrar)

  // 🟦 Dibujar rectángulo de fondo
  page.drawRectangle({
    x: rectX,
    y: rectY,
    width: rectWidth,
    height: rectHeight,
    color: rgb(0.95, 0.95, 0.95), // Color gris claro
    opacity: 0.8, // Transparencia
    borderColor: rgb(0, 0, 0), // Color del borde
    borderWidth: 1, // Grosor del borde
  });

  // 🔹 Textos con nuevas posiciones (más a la izquierda)
  page.drawText(`FECHA DE CANCELACIÓN: ${fechaInput}`, {
    x: xBase,
    y: yBase,
    size: 10,
    font,
    color: rgb(0, 0, 0),
    opacity: 1
  });

  page.drawText(`MOTIVO: ${motivoInput}`, {
    x: xBase,
    y: yBase - 10,
    size: 10,
    font,
    color: rgb(0, 0, 0),
    opacity: 1
  });

  page.drawText(cadenaParte1, {
    x: xparte1,
    y: yBase - 25,
    size: 9,
    font,
    color: rgb(0.0, 0.0, 0.0),
    opacity: 1
  });

  page.drawText(cadenaParte2, {
    x: xparte2,
    y: yBase - 35,
    size: 9,
    font,
    color: rgb(0.0, 0.0, 0.0),
    opacity: 1
  });
}
  // 💾 Guardar PDF
  const originalName = file.name.replace(/\\.pdf$/i, "");
  const newFileName = `${originalName}_CANCELADO.pdf`;
  const pdfBytes = await pdfDoc.save();
  const blob = new Blob([pdfBytes], { type: "application/pdf" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = newFileName;
  link.click();
});
</script>
