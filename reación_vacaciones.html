<!DOCTYPE html>
<html>
<head>
  <title>Datos</title>
</head>
<body>

<h2>Datos de Google Sheets</h2>

<table id="tabla" border="1"></table>

<script>
const URL = "https://script.google.com/macros/s/AKfycbydTUGLcLZY3bjjpsvUsli6m9diG8fZ-zART4-psnDzv0kLT4Vn-PO1fritf7tbuFfY/exec"; // 👈 pega tu /exec

async function cargarDatos() {
  try {
    const res = await fetch(URL);
    const datos = await res.json();

    const tabla = document.getElementById("tabla");

    datos.forEach((fila, index) => {
      const tr = document.createElement("tr");

      fila.forEach(col => {
        const celda = document.createElement(index === 0 ? "th" : "td");
        celda.textContent = col;
        tr.appendChild(celda);
      });

      tabla.appendChild(tr);
    });

  } catch (error) {
    console.error("Error:", error);
  }
}

cargarDatos();
</script>

</body>
</html>
