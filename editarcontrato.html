<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>

window.addEventListener("DOMContentLoaded", async () => {
    await cargarOpciones(); // 🔥 Espera a que carguen
});

    
    const URL_EDITAR = "https://script.google.com/macros/s/AKfycbwaVy3BcTFlbxc4eH1Ry-WSEylImEZVFsLWSbJdcsH_gzbiEkzaWxZ5OAd-9LCbeU8J/exec";

async function buscarContrato() {

    const noCliente = document.getElementById("buscar_no_cliente").value.trim();

    if (!noCliente) {
        Swal.fire({
            icon: "warning",
            title: "Campo vacío",
            text: "Ingresa un número de cliente"
        });
        return;
    }

    Swal.fire({
        title: "Buscando contrato...",
        text: "Por favor espera",
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    try {

        const response = await fetch(
            URL_EDITAR + "?accion=buscar&no_cliente=" + noCliente
        );

        const data = await response.json();

        Swal.close();

        if (data.error) {
            Swal.fire({
                icon: "error",
                title: "No encontrado",
                text: "No existe un contrato con ese número de cliente"
            });
            return;
        }

        Object.keys(data).forEach(key => {
            const campo = document.querySelector(`[name="${key}"]`);
            if (campo) campo.value = data[key];
        });

        Swal.fire({
            icon: "success",
            title: "Contrato cargado",
            timer: 1200,
            showConfirmButton: false
        });

    } catch (error) {
        Swal.close();
        console.error(error);

        Swal.fire({
            icon: "error",
            title: "Error",
            text: "No se pudo conectar con el servidor"
        });
    }
}


async function guardarEdicion() {

    const form = document.getElementById("formContrato");
    const formData = new FormData(form);
    const datos = Object.fromEntries(formData.entries());

    Swal.fire({
        title: "Actualizando contrato...",
        text: "Guardando cambios",
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    try {

        const response = await fetch(URL_EDITAR, {
            method: "POST",
            body: JSON.stringify({
                accion: "editar",
                data: datos
            })
        });

        const resultado = await response.json();

        Swal.close();

        if (resultado.result === "success") {

            Swal.fire({
                icon: "success",
                title: "Actualizado",
                text: "El contrato fue actualizado correctamente"
            });

        } else {

            Swal.fire({
                icon: "error",
                title: "Error",
                text: "No se pudo actualizar"
            });

        }

    } catch (error) {

        Swal.close();
        console.error(error);

        Swal.fire({
            icon: "error",
            title: "Error de conexión",
            text: "No se pudo conectar con el servidor"
        });
    }
}

const URL_OPCIONES = "https://script.google.com/macros/s/AKfycbzYdRzGuJpZzuCPcOso3zilw9O0cye6Z13wLtbLk2RPDkDqZkLUIPAHU0AFkkLpHnhBww/exec";
async function cargarOpciones() {
    try {

        const response = await fetch(URL_OPCIONES + "?accion=opciones");

        if (!response.ok) {
            throw new Error("Error en la respuesta del servidor");
        }

        const data = await response.json();

        console.log("Respuesta opciones:", data);

        Object.keys(data).forEach(nombreCampo => {

            const select = document.querySelector(`[name="${nombreCampo}"]`);

            if (!select) return;

            select.innerHTML = "<option value=''>Seleccionar...</option>";

            data[nombreCampo].forEach(opcion => {
                const option = document.createElement("option");
                option.value = opcion;
                option.textContent = opcion;
                select.appendChild(option);
            });

        });

    } catch (error) {
        console.error("Error cargando opciones:", error);
    }
}


</script>
