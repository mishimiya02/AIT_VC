<script>/*urs appscript modificar aqui y abajo*/
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwdCdlclZCH8UjHwkMJypioA-n7M1h2s5CaFWMXkLrENbUmbrt7QVrA0KRxRnblpnkm8Q/exec";

// Función para cargar datos en el formulario
function cargarDatosRegistro(data) {
  for (const key in data) {
    const input = document.querySelector(`[name="${key}"]`);
    if (input) {
      if (input.type === "date" && data[key]) {
        const fecha = new Date(data[key]);
        if (!isNaN(fecha)) {
          input.value = fecha.toISOString().split("T")[0];
        } else {
          // Si Google devuelve algo como "10/10/2025"
          const partes = data[key].split("/");
          if (partes.length === 3) {
            const formatoISO = `${partes[2]}-${partes[1].padStart(2, "0")}-${partes[0].padStart(2, "0")}`;
            input.value = formatoISO;
          }
        }
      } else {
        input.value = data[key];
      }
    }
  }
  document.getElementById("updateForm").style.display = "block";
}


// Buscar registro por ID
document.getElementById("btnBuscar").addEventListener("click", async () => {
  const id = document.getElementById("buscarID").value.trim();
  if (!id) return alert("Por favor ingresa un ID.");

  // Llamada a tu Web App para obtener datos del ID
  const response = await fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify({ action: "get", ID: id })
  });
  const result = await response.json();

  if (result.status === "success") {
    cargarDatosRegistro(result.data);
  } else {
    alert(result.message);
  }
});

// Enviar formulario de actualización
document.getElementById("updateForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const data = Object.fromEntries(formData.entries());
  data.action = "update";
/*url de appscript contratos a modificar al actualizar aqui y arriba, tambien en enviar contratojs son 3*/
  const response = await fetch("https://script.google.com/macros/s/AKfycbwdCdlclZCH8UjHwkMJypioA-n7M1h2s5CaFWMXkLrENbUmbrt7QVrA0KRxRnblpnkm8Q/exec", {
    method: "POST",
    body: JSON.stringify(data)
  });
  const result = await response.json();
  alert(result.message);
});



// 🔁 Función para calcular días y estatus

function calcularEstado() {
  const hoy = new Date();
  const fechaInicio = new Date(document.getElementById("fecha-inicio").value);
  const fechaFin = new Date(document.getElementById("fecha-fin").value);

  // Normalizar horas
  hoy.setHours(0, 0, 0, 0);
  fechaInicio.setHours(0, 0, 0, 0);
  fechaFin.setHours(0, 0, 0, 0);

  let diasPorVencer = 0;
  let diasVencidos = 0;
  let estatus = "";

  if (!isNaN(fechaFin)) {
    const diferenciaMs = fechaFin - hoy;
    const diferenciaDias = Math.floor(diferenciaMs / (1000 * 60 * 60 * 24));

    if (diferenciaDias > 0) {
      // 🔹 Por vencer → sumamos 1 para incluir el día final
      diasPorVencer = diferenciaDias + 1;
      diasVencidos = 0;
      estatus = "POR VENCER";
    } else if (diferenciaDias < 0) {
      // 🔹 Vencido → restamos 1 para no contar el día actual
      diasPorVencer = 0;
      diasVencidos = Math.abs(diferenciaDias) - 1;
      if (diasVencidos < 0) diasVencidos = 0; // seguridad
      estatus = "VENCIDO";
    } else {
      // 🔹 Hoy vence
      diasPorVencer = 0;
      diasVencidos = 0;
      estatus = "VIGENTE";
    }
  } else {
    diasPorVencer = 0;
    diasVencidos = 0;
    estatus = "";
  }

  document.getElementById("porVencer").value = diasPorVencer;
  document.getElementById("vencidos").value = diasVencidos;
  document.getElementById("estatus").value = estatus;
}

document.getElementById("fecha-inicio").addEventListener("change", calcularEstado);
document.getElementById("fecha-fin").addEventListener("change", calcularEstado);


// Función general para recalcular montos
function recalcularMontos() {
  const tarifa = parseFloat(document.getElementById('tarifa').value) || 0;

  const luzPorc = parseFloat(document.getElementById('luz').value) || 0;
  const aguaPorc = parseFloat(document.getElementById('agua').value) || 0;
  const mantPorc = parseFloat(document.getElementById('mantenimiento').value) || 0;

  // Calculamos los valores en pesos
  const luzMonto = (tarifa * luzPorc) / 100;
  const aguaMonto = (tarifa * aguaPorc) / 100;
  const mantMonto = (tarifa * mantPorc) / 100;

  // Actualizamos los campos de monto
  document.getElementById('luz$').value = luzMonto.toFixed(2);
  document.getElementById('agua$').value = aguaMonto.toFixed(2);
  document.getElementById('mantenimiento$').value = mantMonto.toFixed(2);
}

// Detectar cambios en tarifa o porcentajes
['tarifa', 'luz', 'agua', 'mantenimiento'].forEach(id => {
  document.getElementById(id).addEventListener('input', recalcularMontos);
});

// 🧮 Función para calcular el subtotal
function calcularSubtotal() {
  const tarifa = parseFloat(document.getElementById('tarifa').value) || 0;
  const luzMonto = parseFloat(document.getElementById('luz$').value) || 0;
  const aguaMonto = parseFloat(document.getElementById('agua$').value) || 0;
  const mantMonto = parseFloat(document.getElementById('mantenimiento$').value) || 0;

  const subtotal = tarifa + luzMonto + aguaMonto + mantMonto;
  document.getElementById('subtotal').value = subtotal.toFixed(2);
}

// 🔁 Actualizar subtotal cuando cambien los montos o la tarifa
['tarifa', 'luz$', 'agua$', 'mantenimiento$'].forEach(id => {
  document.getElementById(id).addEventListener('input', calcularSubtotal);
});


const sidebar = document.getElementById("sidebar");
  const toggleBtn = document.getElementById("toggleSidebar");

  toggleBtn.addEventListener("click", () => {
    sidebar.classList.toggle("open");
    // Cambia el icono ☰ ↔ ✖
    toggleBtn.textContent = sidebar.classList.contains("open") ? "✖" : "☰";
  });



// 🧩 Función para copiar el subtotal al campo "importebruto"
function actualizarImporteBruto() {
  const subtotal = parseFloat(document.getElementById('subtotal').value) || 0;
  document.getElementById('importebruto').value = subtotal.toFixed(2);
}

// 🧮 Función para calcular la garantía según el tipo seleccionado
function calcularGarantia() {
  const subtotal = parseFloat(document.getElementById('importebruto').value) || 0;
  const tipo = document.getElementById('ope').value;
  const IVA = 0.16; // 16%

  let resultado = 0;

  switch (tipo) {
    case "1": // DGX3
      resultado = (subtotal * 3) * (1 + IVA);
      break;

    case "2": // FC - suma un monto manual al subtotal
      const montoExtra = parseFloat(prompt("Ingrese el monto adicional:")) || 0;
      resultado = subtotal + montoExtra;
      break;

    case "3": // NO APLICA
      resultado = subtotal;
      break;

    case "4": // FCX3
      resultado = (subtotal * 3) * (1 + IVA);
      break;

    case "5": // DGX1
      resultado = subtotal * (1 + IVA);
      break;

    case "6": // FCX12
      resultado = (subtotal * 12) * (1 + IVA);
      break;

    case "7": // FDX30DÍAS (monto manual)
      const monto30 = parseFloat(prompt("Ingrese el monto de la garantía 30 días:")) || 0;
      resultado = monto30;
      break;

    case "8": // PromMensualopsX3
      const montoProm = parseFloat(prompt("Ingrese el monto promedio mensual:")) || 0;
      resultado = montoProm * 3;
      break;

    default:
      resultado = subtotal;
  }

  // Mostrar el resultado en la sidebar (creamos un campo dinámico si no existe)
  let resultadoCampo = document.getElementById('resultadoGarantia');
  if (!resultadoCampo) {
    resultadoCampo = document.createElement('div');
    resultadoCampo.id = 'resultadoGarantia';
    resultadoCampo.style.marginTop = '10px';
    resultadoCampo.style.fontWeight = 'bold';
    document.getElementById('sidebar').appendChild(resultadoCampo);
  }

  resultadoCampo.textContent = `💰 Monto de Garantía: $${resultado.toFixed(2)}`;
}

// 🔁 Detectar cambios en subtotal y tipo de garantía
document.getElementById('subtotal').addEventListener('input', actualizarImporteBruto);
document.getElementById('ope').addEventListener('change', calcularGarantia);



</script>
