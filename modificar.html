<script>/*urs appscript modificar aqui y abajo*/
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwdCdlclZCH8UjHwkMJypioA-n7M1h2s5CaFWMXkLrENbUmbrt7QVrA0KRxRnblpnkm8Q/exec";

// Función para cargar datos en el formulario
function cargarDatosRegistro(data) {
  for (const key in data) {
    const input = document.querySelector(`[name="${key}"]`);
    if (input) {
      if (input.type === "date" && data[key]) {
        const fecha = new Date(data[key]);
        if (!isNaN(fecha)) {
          input.value = fecha.toISOString().split("T")[0];
        } else {
          // Si Google devuelve algo como "10/10/2025"
          const partes = data[key].split("/");
          if (partes.length === 3) {
            const formatoISO = `${partes[2]}-${partes[1].padStart(2, "0")}-${partes[0].padStart(2, "0")}`;
            input.value = formatoISO;
          }
        }
      } else {
        input.value = data[key];
      }
    }
  }
  document.getElementById("updateForm").style.display = "block";
}


// Buscar registro por ID
document.getElementById("btnBuscar").addEventListener("click", async () => {
  const id = document.getElementById("buscarID").value.trim();
  if (!id) return alert("Por favor ingresa un ID.");

  // Llamada a tu Web App para obtener datos del ID
  const response = await fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify({ action: "get", ID: id })
  });
  const result = await response.json();

  if (result.status === "success") {
    cargarDatosRegistro(result.data);
  } else {
    alert(result.message);
  }
});

// Enviar formulario de actualización
document.getElementById("updateForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const data = Object.fromEntries(formData.entries());
  data.action = "update";
/*url de appscript contratos a modificar al actualizar aqui y arriba, tambien en enviar contratojs son 3*/
  const response = await fetch("https://script.google.com/macros/s/AKfycbwdCdlclZCH8UjHwkMJypioA-n7M1h2s5CaFWMXkLrENbUmbrt7QVrA0KRxRnblpnkm8Q/exec", {
    method: "POST",
    body: JSON.stringify(data)
  });
  const result = await response.json();
  alert(result.message);
});
















// 🔁 Función para calcular días y estatus

function calcularEstado() {
  const hoy = new Date();
  const fechaInicio = new Date(document.getElementById("fecha-inicio").value);
  const fechaFin = new Date(document.getElementById("fecha-fin").value);

  // Normalizar horas
  hoy.setHours(0, 0, 0, 0);
  fechaInicio.setHours(0, 0, 0, 0);
  fechaFin.setHours(0, 0, 0, 0);

  let diasPorVencer = 0;
  let diasVencidos = 0;
  let estatus = "";

  if (!isNaN(fechaFin)) {
    const diferenciaMs = fechaFin - hoy;
    const diferenciaDias = Math.floor(diferenciaMs / (1000 * 60 * 60 * 24));

    if (diferenciaDias > 0) {
      // 🔹 Por vencer → sumamos 1 para incluir el día final
      diasPorVencer = diferenciaDias + 1;
      diasVencidos = 0;
      estatus = "POR VENCER";
    } else if (diferenciaDias < 0) {
      // 🔹 Vencido → restamos 1 para no contar el día actual
      diasPorVencer = 0;
      diasVencidos = Math.abs(diferenciaDias) - 1;
      if (diasVencidos < 0) diasVencidos = 0; // seguridad
      estatus = "VENCIDO";
    } else {
      // 🔹 Hoy vence
      diasPorVencer = 0;
      diasVencidos = 0;
      estatus = "VIGENTE";
    }
  } else {
    diasPorVencer = 0;
    diasVencidos = 0;
    estatus = "";
  }

  document.getElementById("porVencer").value = diasPorVencer;
  document.getElementById("vencidos").value = diasVencidos;
  document.getElementById("estatus").value = estatus;
}

document.getElementById("fecha-inicio").addEventListener("change", calcularEstado);
document.getElementById("fecha-fin").addEventListener("change", calcularEstado);



</script>
