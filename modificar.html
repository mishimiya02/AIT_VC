<h1>Modificar Registro</h1>
<h1>Modificar Registro</h1>

<!-- Formulario para buscar el registro por ID -->
<div style="max-width: 800px; margin: auto; margin-bottom: 2rem;">
  <label for="buscarID">Ingrese el ID a modificar:</label>
  <input type="text" id="buscarID" placeholder="ID del registro">
  <button id="btnBuscar">Buscar</button>
</div>

<form id="updateForm" style="display:none;">
  <div class="form-group">
    <label for="ID">ID</label>
    <input type="text" id="ID" name="ID" readonly>
  </div>
  <div class="form-group">
    <label for="NO_CLIENTE">No. Cliente</label>
    <input type="text" id="NO_CLIENTE" name="NO. CLIENTE">
  </div>
  <div class="form-group">
    <label for="NO_CONTRATO">No. Contrato</label>
    <input type="text" id="NO_CONTRATO" name="NO. CONTRATO">
  </div>
  <div class="form-group">
    <label for="TIPO_CONTRATO">Tipo Contrato</label>
    <input type="text" id="TIPO_CONTRATO" name="TIPO CONTRATO">
  </div>
  <div class="form-group">
    <label for="RAZON_SOCIAL">Razón Social</label>
    <input type="text" id="RAZON_SOCIAL" name="RAZÓN SOCIAL">
  </div>

  <button type="submit">Actualizar Registro</button>
</form>

<script>/*urs appscript modificar aqui y abajo*/
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwdCdlclZCH8UjHwkMJypioA-n7M1h2s5CaFWMXkLrENbUmbrt7QVrA0KRxRnblpnkm8Q/exec";

// Función para cargar datos en el formulario
function cargarDatosRegistro(data) {
  for (const key in data) {
    const input = document.querySelector(`[name="${key}"]`);
    if (input) input.value = data[key];
  }
  document.getElementById("updateForm").style.display = "block";
}

// Buscar registro por ID
document.getElementById("btnBuscar").addEventListener("click", async () => {
  const id = document.getElementById("buscarID").value.trim();
  if (!id) return alert("Por favor ingresa un ID.");

  // Llamada a tu Web App para obtener datos del ID
  const response = await fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify({ action: "get", ID: id })
  });
  const result = await response.json();

  if (result.status === "success") {
    cargarDatosRegistro(result.data);
  } else {
    alert(result.message);
  }
});

// Enviar formulario de actualización
document.getElementById("updateForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const data = Object.fromEntries(formData.entries());
  data.action = "update";
/*url de appscript contratos a modificar al actualizar aqui y arriba, tambien en enviar contratojs son 3*/
  const response = await fetch("https://script.google.com/macros/s/AKfycbwdCdlclZCH8UjHwkMJypioA-n7M1h2s5CaFWMXkLrENbUmbrt7QVrA0KRxRnblpnkm8Q/exec", {
    method: "POST",
    body: JSON.stringify(data)
  });
  const result = await response.json();
  alert(result.message);
});
</script>
