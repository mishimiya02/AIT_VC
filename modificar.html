  <!-- CONTENEDOR DE BÚSQUEDA -->
  <div class="container">
    
 <h1>Modificar Registro por ID</h1>

  <div id="buscar">
    <label for="buscarID">Introduce el ID:</label>
    <input type="text" id="buscarID" placeholder="Ejemplo: 123">
    <button id="btnBuscar">Buscar</button>
  </div>

  <form id="form-container">
    <h2>Datos del Registro</h2>

    <div class="form-group">
      <label>ID</label>
      <input type="text" name="ID" readonly>
    </div>

    <div id="campos"></div>

    <button type="button" id="btnActualizar">Actualizar Registro</button>
  </form>

  <script>
     /*urL appscript modificar aqui y abajo
"https://script.google.com/macros/s/AKfycbwdCdlclZCH8UjHwkMJypioA-n7M1h2s5CaFWMXkLrENbUmbrt7QVrA0KRxRnblpnkm8Q/exec";*/

    const url = "https://script.google.com/macros/s/AKfycbwdCdlclZCH8UjHwkMJypioA-n7M1h2s5CaFWMXkLrENbUmbrt7QVrA0KRxRnblpnkm8Q/exec"; // ← Reemplaza con tu URL desplegada de Apps Script

    // === 1️⃣ Buscar registro por ID ===
    document.getElementById("btnBuscar").addEventListener("click", async () => {
      const id = document.getElementById("buscarID").value.trim();
      if (!id) {
        alert("Por favor, ingresa un ID.");
        return;
      }

      const respuesta = await fetch(url + "?action=getById&id=" + encodeURIComponent(id));
      const data = await respuesta.json();

      if (data.status === "error") {
        alert(data.message);
        return;
      }

      mostrarFormulario(data.registro);
    });

    // === 2️⃣ Mostrar los campos con los valores actuales ===
    function mostrarFormulario(registro) {
      const contenedor = document.getElementById("campos");
      contenedor.innerHTML = ""; // Limpia el formulario anterior

      // Lista completa de encabezados (en el mismo orden que tu hoja)
      const campos = [
        "NUM CLIENTE", "NUM DCT SAP", "NUM CONTRATO", "TIPO CONTRATO", "RAZON SOCIAL",
        "NOMBRE COMERCIAL", "CONCEPTO", "UNIDADES / M2", "TARIFA M2/UNIDADES",
        "FECHA INICIO", "FECHA FIN", "DIAS POR VENCER", "DIAS VENCIDOS",
        "ESTATUS  VIGENCIA", "TARIFA", "MANTENIMIENTO %", "LUZ $", "AGUA%",
        "$ MANTENIMIENTO", "$LUZ", "$AGUA", "SUBTOTAL", "INCENTIVO %",
        "%VARIABLE", "%PENALIZACIÓN", "DÍAS VIGENCIA", "TIPO DE VIGENCIA", "PREMISA",
        "BASE DE PREMISA", "PERIORICIDAD", "METODOLOGÍA DE ACTUALIZACIÓN",
        "PROX. FEC. ACTUALIZACIÓN", "C. ACTUALIZACIÓN", "COMUNICADO", "INTERESES",
        "DÍAS DE CRÉDITO", "GARANTÍA", "MONTO GARANTÍA", "OBSERVACIONES",
        "OBJETO", "TOTAL", "CORREO ELECTRÓNICO SAP", "UBICACIÓN", "DETALLE DE UBICACIÓN",
        "ENLACE", "CORREO", "ESTATUS FACTURACIÓN"
      ];

      // Generar inputs con valores actuales
      campos.forEach(campo => {
        const div = document.createElement("div");
        div.classList.add("form-group");

        const label = document.createElement("label");
        label.textContent = campo;

        const input = document.createElement("input");
        input.name = campo;
        input.value = registro[campo] || "";

        div.appendChild(label);
        div.appendChild(input);
        contenedor.appendChild(div);
      });

      // Mostrar formulario
      document.getElementById("form-container").style.display = "block";

      // Cargar ID
      document.querySelector('input[name="ID"]').value = registro["ID"];
    }

    // === 3️⃣ Enviar actualización ===
    document.getElementById("btnActualizar").addEventListener("click", async () => {
      const form = document.getElementById("form-container");
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      data.action = "update";

      const respuesta = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      const result = await respuesta.json();
      alert(result.message || "Error al actualizar");
    });
  </script>
