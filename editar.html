<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Cuenta</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    .btn { padding: 10px 20px; background-color: #007BFF; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .btn:hover { background-color: #0056b3; }
    #searchResults { margin-top: 20px; }
    .success { color: green; }
    .error { color: red; }
</style>
</head>
<body>

<h1>BUSCAR POR NÚMERO DE CUENTA</h1>

<form id="searchForm">
    <div class="form-group">
        <label for="accountNumber">Número de cuenta <span class="required">*</span></label>
        <input type="text" id="accountNumber" name="accountNumber" required>
    </div>

    <button type="submit" class="btn">Buscar Cuenta</button>
</form>

<div id="searchResults">
    <h3>Resultados de la Búsqueda</h3>
    <div id="resultsContainer"></div>
</div>

<script>
document.getElementById("searchForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const accountNumber = document.getElementById("accountNumber").value.trim();
    const resultsContainer = document.getElementById("resultsContainer");

    if (!accountNumber) {
        resultsContainer.innerHTML = `<p class="error">Ingrese un número de cuenta.</p>`;
        return;
    }

    resultsContainer.innerHTML = `<p>Buscando...</p>`;

    try {
        // Reemplaza la URL con la de tu Apps Script Web App
        const response = await fetch(`https://script.google.com/macros/s/AKfycbyJdDjqV0SnFl4RH4clZ-PeoN5aWTgoBsV7h6z8y-0FJLPD5Ios9hnXqL9tb0xBp8K6Pg/exec"; /*cambiar url son 2 aqui y en proxy */
            accountNumber=${accountNumber}`);
        const data = await response.json();

        if (data.error) {
            resultsContainer.innerHTML = `<p class="error">❌ ${data.error}</p>`;
        } else {
            // Ajusta las columnas según tu hoja
            resultsContainer.innerHTML = `
                <p class="success">✅ Cuenta encontrada</p>
                <p><strong>Número de cuenta:</strong> ${data[0]}</p>
                <p><strong>Nombre:</strong> ${data[1]}</p>
                <p><strong>Email:</strong> ${data[2]}</p>
            `;
        }
    } catch (err) {
        resultsContainer.innerHTML = `<p class="error">❌ Error al buscar la cuenta</p>`;
        console.error(err);
    }
});
</script>

</body>
</html>
