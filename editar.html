  <!-- CONTENEDOR DE BÚSQUEDA -->
  <div class="container">
    <h2>🔍🛫 Buscar por ID</h2>
    <input type="text" id="buscarId" placeholder="Escribe un ID">
    <button onclick="buscar()">Buscar</button>

    <pre id="resultado">Esperando búsqueda...</pre>
  </div>

  <script>
    const sheetID = "1cGJk_Dg2DjT9h2_cH1ScQ5cgCxlPtg2eQXQIzPv79gk"; /*la id de la hoja*/
    const apiKey = "AIzaSyDF19wfT_gt1so2fEzqtpetQuOLm5-vHdo";  /*la url de la api*/
    const range = "respuestas!A:Z";   /*el nombre de la hoja exacta */

    async function buscar() {
      const id = document.getElementById("buscarId").value.trim();
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetID}/values/${range}?key=${apiKey}`;
      
      document.getElementById("resultado").textContent = "⏳ 🚁 Buscando...";

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.values) {
          document.getElementById("resultado").textContent = "⚠️ No se encontraron datos.🚩";
          return;
        }

        const headers = data.values[0];
        const rows = data.values.slice(1);

        const row = rows.find(r => r[0] === id);

        if (row) {
          let result = {};
          headers.forEach((h, i) => {
            result[h] = row[i] || "";
          });

          document.getElementById("resultado").textContent = JSON.stringify(result, null, 2);
          localStorage.setItem("datosUsuario", JSON.stringify(result));
        } else {
          document.getElementById("resultado").textContent = "❌ No se encontró ese ID.";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("resultado").textContent = "⚠️ Error al consultar la API.";
      }
    }
  </script>
