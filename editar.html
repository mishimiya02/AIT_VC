<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscar con Google Sheets API</title>
</head>
<body>
  <h2>Buscar por ID</h2>
  <input type="text" id="buscarId" placeholder="Escribe un ID">
  <button onclick="buscar()">Buscar</button>

  <pre id="resultado"></pre>

  <script>
    const sheetID = "1cGJk_Dg2DjT9h2_cH1ScQ5cgCxlPtg2eQXQIzPv79gk";   // reemplaza con tu ID de hoja
    const apiKey = "AIzaSyDF19wfT_gt1so2fEzqtpetQuOLm5-vHdo";       // tu API Key
    const range = "respuestas!A:Z";         // lee hasta la columna Z (ajusta según tu hoja)

    async function buscar() {
      const id = document.getElementById("buscarId").value;

      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetID}/values/${range}?key=${apiKey}`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.values) {
          document.getElementById("resultado").textContent = "⚠️ No se encontraron datos.";
          return;
        }

        // La primera fila son encabezados
        const headers = data.values[0];
        const rows = data.values.slice(1);

        // Buscar la fila que tenga el ID en la primera columna
        const row = rows.find(r => r[0] === id);

        if (row) {
          let result = {};
          headers.forEach((h, i) => {
            result[h] = row[i] || "";
          });

          // Mostrar
          document.getElementById("resultado").textContent = JSON.stringify(result, null, 2);

          // Guardar en localStorage
          localStorage.setItem("datosUsuario", JSON.stringify(result));
        } else {
          document.getElementById("resultado").textContent = "❌ No se encontró ese ID.";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("resultado").textContent = "⚠️ Error al consultar la API.";
      }
    }
  </script>
</body>
</html>
