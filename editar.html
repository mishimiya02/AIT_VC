    <script>
        // Mostrar el loader cuando la página comience a cargar
        document.addEventListener('DOMContentLoaded', function() {
            AvionLoading.mostrar();
        });

        // Ocultar el loader cuando todo esté cargado
        window.addEventListener('load', function() {
            setTimeout(function() {
                AvionLoading.ocultar();
            }, 2000); // 2 segundos de demostración
        });

        // También puedes usarlo para transiciones entre páginas
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A' && e.target.href) {
                e.preventDefault();
                AvionLoading.mostrar();
                
                // Navegar después de mostrar el loader
                setTimeout(function() {
                    window.location.href = e.target.href;
                }, 500);
            }
        });
       
    </script>
</head>

            <!-- justo arriba de href contacto;Segundo Dropdown de Recursos -->
            <div class="dropdown">

    <h1>CONSULTAR3</h1>
        
    <form id="searchForm">
        <div class="cedula-container">
            <div class="form-group">
                <label for="accountNumber">Número de cuenta <span class="required">*</span></label>
                <input type="text" id="accountNumber" name="accountNumber" required>
                <div class="error" id="accountNumberError">Por favor ingrese un número de cuenta válido</div>
            </div>
            
            <div class="btn-container">
                <button type="submit" class="btn">Buscar Cuenta</button>
            </div>
        </div>
             
    
    </form>
   
    <!-- Sección para mostrar resultados -->
    <div id="searchResults">
        <h3>Resultados de la Búsqueda</h3>
        <div id="resultsContainer"></div>
    </div>

    
    
<script>
// URL de tu función proxy de Netlify
const PROXY_URL = '/.netlify/functions/search';


document.addEventListener('DOMContentLoaded', function() {
    const searchForm = document.getElementById('searchForm');
    const resultsContainer = document.getElementById('resultsContainer');
    const searchResults = document.getElementById('searchResults');
    
    searchForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const accountNumber = document.getElementById('accountNumber').value.trim();
        
        if (!accountNumber) {
            alert('Por favor ingrese un número de cuenta');
            return;
        }
        
        // Mostrar estado de carga
        resultsContainer.innerHTML = '<div class="loading">Buscando...</div>';
        searchResults.style.display = 'block';
        
        try {
            // Llamar al proxy de Netlify enviando JSON
            const response = await fetch(PROXY_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'buscarPorNumeroCuenta',
                    numeroCuenta: accountNumber
                })
            });
            
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            
            // Obtener JSON directamente
            const resultados = await response.json();
            console.log("Respuesta parseada:", resultados);
            
            displayResults(resultados);
            
        } catch (error) {
            showError(error);
        }
    });
    
    function displayResults(resultados) {
        if (resultados && resultados.length > 0) {
            let html = '<p>Se encontraron ' + resultados.length + ' resultado(s):</p>';
            
            resultados.forEach((fila, index) => {
                html += '<div class="result-item">';
                html += '<h4>Resultado #' + (index + 1) + '</h4>';
                
                // Mostrar cada campo de la fila
                fila.forEach((valor, i) => {
                    html += `
                        <div class="result-field">
                            <span class="field-name">Campo ${i + 1}:</span>
                            <span>${valor || 'N/A'}</span>
                        </div>
                    `;
                });
                
                html += '</div>';
            });
            
            resultsContainer.innerHTML = html;
        } else {
            resultsContainer.innerHTML = '<div class="no-results">No se encontraron resultados para el número de cuenta proporcionado.</div>';
        }
    }
    
    function showError(error) {
        resultsContainer.innerHTML = '<div class="no-results">Error: ' + (error.message || 'Ocurrió un error durante la búsqueda') + '</div>';
        console.error('Error:', error);
    }
});
</script>

</body>
