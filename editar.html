  <div class="container">
    <h2>🔍🛫 Buscar por ID</h2>
    <input type="text" id="buscarId" placeholder="Escribe un ID">
    <button onclick="buscar()">Buscar</button>

    <pre id="resultado">Esperando búsqueda...</pre>
    <button id="borrarDatos" style="margin-top:15px;">🗑️ Borrar datos guardados</button>
    <button id="actualizarHoja" style="margin:15px 0; padding:8px 15px; border:none; border-radius:8px; background:#2575fc; color:#fff; cursor:pointer;">
🔄 Actualizar hoja de cálculo
</button>
<button>
<a href="catalogo.html"  style="margin:15px 0;text-decoration: none; padding:4px 6px; border:none; border-radius:8px; background:#2575fc; color:#fff; cursor:pointer;">REGISTAR CONTRATO</a>  </button>

  <script>
  const sheetID = "1cGJk_Dg2DjT9h2_cH1ScQ5cgCxlPtg2eQXQIzPv79gk"; /*la id de la hoja*/
  const apiKey = "AIzaSyDF19wfT_gt1so2fEzqtpetQuOLm5-vHdo";  /*la url de la api*/
  const range = "respuestas!A:Z";   /*el nombre de la hoja exacta */
async function buscar() {
  const id = document.getElementById("buscarId").value.trim();
  const resultado = document.getElementById("resultado");

  resultado.className = "buscando";
  resultado.textContent = "⏳ 🚁 Buscando...";

  try {
    const headers = JSON.parse(localStorage.getItem("cacheHeaders"));
    const rows = JSON.parse(localStorage.getItem("cacheFilas"));

    if (!headers || !rows) {
      resultado.className = "error";
      resultado.textContent = "⚠️ No hay datos cargados.";
      return;
    }

    const row = rows.find(r => r[0] === id);

    if (row) {
      let result = {};
      headers.forEach((h, i) => {
        result[h] = row[i] || "";
      });

      resultado.className = "exito";

      let html = "<ul>";
      for (const [key, value] of Object.entries(result)) {
        html += `<li><strong>${key}:</strong> ${value || "—"}</li>`;
      }
      html += "</ul>";
      resultado.innerHTML = html;

      localStorage.setItem("datosUsuario", JSON.stringify(result));

      Swal.fire({
        title: '✅🛩️ Datos guardados',
        text: 'La información ha sido rectificada.',
        icon: 'success',
        confirmButtonText: 'Aceptar'
      });
    } else {
      resultado.className = "error";
      resultado.textContent = "❌ No se encontró ese ID.";
    }
  } catch (err) {
    console.error(err);
    resultado.className = "error";
    resultado.textContent = "⚠️ Error al consultar los datos en memoria.";
  }
}


  document.getElementById("borrarDatos").addEventListener("click", () => {
  Swal.fire({
    title: '⚠️ ¿Seguro?',
    text: "Borrar en caso de hacer otra búsqueda.",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d33',
    cancelButtonColor: '#3085d6',
    confirmButtonText: 'Sí, borrar',
    cancelButtonText: 'Cancelar'
  }).then((result) => {
    if (result.isConfirmed) {
      localStorage.removeItem("datosUsuario"); // solo borra lo que guardamos
      document.getElementById("resultado").innerHTML = "🗑️ Datos eliminados.";
      document.getElementById("resultado").className = "error";
      Swal.fire(
        '✅ Listo',
        'Los datos han sido eliminados.',
        'success'
      );
    }
  });
});
async function cargarHoja() {
  const resultado = document.getElementById("resultado");
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetID}/values/${range}?key=${apiKey}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.values) {
      resultado.className = "error";
      resultado.textContent = "⚠️ No se pudieron cargar los datos iniciales.";
      return;
    }

    const headers = data.values[0];
    const rows = data.values.slice(1);

    // Guardar en cache
    localStorage.setItem("cacheHeaders", JSON.stringify(headers));
    localStorage.setItem("cacheFilas", JSON.stringify(rows));

    console.log("✅ Hoja cargada en memoria local");
  } catch (err) {
    console.error("Error al cargar hoja:", err);
    resultado.className = "error";
    resultado.textContent = "⚠️ Error al precargar la hoja.";
  }
}
// Precargar la hoja apenas se abra la página
window.addEventListener("load", cargarHoja);




document.getElementById("actualizarHoja").addEventListener("click", async () => {
  Swal.fire({
    title: '⏳ Actualizando...',
    text: 'Descargando la hoja de cálculo, por favor espera.',
    allowOutsideClick: false,
    didOpen: () => {
      Swal.showLoading();
    }
  });

  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetID}/values/${range}?key=${apiKey}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.values) {
      Swal.fire('⚠️ Error', 'No se pudieron actualizar los datos.', 'error');
      return;
    }

    const headers = data.values[0];
    const rows = data.values.slice(1);

    localStorage.setItem("cacheHeaders", JSON.stringify(headers));
    localStorage.setItem("cacheFilas", JSON.stringify(rows));

    Swal.fire('✅ Listo', 'La hoja se actualizó correctamente.', 'success');
  } catch (err) {
    console.error("Error al actualizar hoja:", err);
    Swal.fire('⚠️ Error', 'Ocurrió un problema al actualizar la hoja.', 'error');
  }
});

</script>
