

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenida</title>

  <script src="java/loginprincipal.js"></script>
  <style>
    :root {
      --rosa: #75a0ff;
      --rosa-claro: #2149ff;
      --blanco: #ffffff;
      --texto: #333333;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--rosa), var(--rosa-claro));
    }

    .card {
      background: var(--blanco);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      color: var(--texto);
    }

    p {
      color: #555;
      margin-bottom: 2rem;
    }

    .buttons {
      display: grid;
      gap: 1rem;
    }

    button {
      border: none;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--rosa);
      color: rgb(0, 0, 0);
    }

    .btn-secondary {
      background: var(--rosa-claro);
      color: #ffffff;
      margin-bottom: 8px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>SISTEMA DE APOYO ADMINISTRATIVO</h1>
    <p>Ingresa tu contraseña (mayuscukas) y elige a dónde deseas ingresar</p>

    <div class="buttons">
      <input type="password" id="password" placeholder="Ingresa tu contraseña" style="padding:0.9rem;border-radius:12px;border:1px solid #ccc;font-size:1rem;" />

      <button class="btn-primary" onclick="validarAcceso('loginprincipal.html')">
        Opción 1 · EMISIÓN DE RECIBOS
      </button>

      <button class="btn-secondary" onclick="validarAcceso('cdblogin.html')">
        Opción 2 · CBD 
      </button>

      <p id="error" style="color:#c0392b; display:none; margin-top:0.5rem;">Contraseña incorrecta</p>
    </div>

      <button class="btn-primary" onclick="validarAcceso()">Entrar</button>

      <p id="error" style="color:#c0392b; display:none; margin-top:0.5rem;">Contraseña incorrecta</p>
    </div>
  </div>

</body>
</html>
