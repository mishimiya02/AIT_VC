<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Acceso a registrar Contrato</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffd000, #ffa600, #ff9100,#ffd000);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: rgb(255, 255, 255);
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.1);
      text-align: center;
      width: 450px;
    }
 
    h2 { margin-bottom: 15px; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 16px;
      text-align: center;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #2575fc;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔒 Acceso restringido</h2>
    <p>Introduce tu nombre de usuario autorizado (minusculas):</p>
    <input type="text" id="usuario" placeholder="Por favor identificate" />
    <button id="btnLogin">Entrar</button>
  </div>

  <script>
    // Lista de usuarios permitidos
    const USUARIOS_PERMITIDOS = [
      "adminait",
      "rmv",
      "jm",
      "reservado03",
      "reservado04"
    ];

    document.getElementById("btnLogin").addEventListener("click", () => {
      const usuario = document.getElementById("usuario").value.trim().toLowerCase();

      if (!usuario) {
        Swal.fire("⚠️ Ingresa un nombre de usuario.");
        return;
      }

      if (USUARIOS_PERMITIDOS.includes(usuario)) {
        sessionStorage.setItem("loggedUser", usuario);
        sessionStorage.setItem("loggedIn", "true");
        Swal.fire({
          icon: "success",
          title: "✅ Bienvenido " + usuario,
          timer: 1200,
          showConfirmButton: false
        }).then(() => {
          window.location.href = "catalogo.html";
        });
      } else {
        Swal.fire({
          icon: "error",
          title: "❌ Usuario no autorizado",
          text: "No tienes permiso para acceder a esta sección."
        });
      }
    });

    // Permitir Enter
    document.getElementById("usuario").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("btnLogin").click();
    });
  </script>
</body>
</html>
