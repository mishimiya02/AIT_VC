<div class="page-wrapper">

        <h2>Corrección de datos </h2>
        <h3>1.-Ingrese el ID del trabajador y se desplegara su información</h3>
        <h3>2.-Elija  que desea modificar</h3>

        <div class="form-group">
            <label>No. de empleado</label>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbwMDJDIhWuG6MQuaT1l9UsfMEeAYsw8pJHNECbz9NFrEb9NbajREaMV09Z83KQaOkuh6Q/exec";


async function buscarTrabajador() {

    const id = document.getElementById("buscar_id").value.trim();

    if (!id) {
        Swal.fire("Ingresa un ID");
        return;
    }

    Swal.fire({
        title: "Buscando...",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });

    try {

        const response = await fetch(URL + "?accion=buscar&id=" + id);
        const data = await response.json();

        Swal.close();

        if (!data.ok) {
            Swal.fire("Empleado no encontrado");
            return;
        }

        mostrarFormulario(data);

    } catch (error) {
        Swal.close();
        Swal.fire("Error de conexión");
        console.error(error);
    }
}



async function mostrarFormulario(data) {

    const opcion = await Swal.fire({
        title: "¿Qué deseas modificar?",
        showDenyButton: true,
        confirmButtonText: "Datos personales",
        denyButtonText: "Días disponibles",
        cancelButtonText: "Cancelar",
        showCancelButton: true
    });

    if (opcion.isDismissed) return;

    const editarDatos = opcion.isConfirmed;
    const editarDias = opcion.isDenied;

    const { value: formValues } = await Swal.fire({
        title: "Editar empleado",
        width: 600,
        html: `
        
        <label style="margin-top:10px;">Nombre</label>

        <input id="swal_nombre" class="swal2-input"
        placeholder="Nombre"
        value="${data.NOMBRE}"
        ${editarDias ? "disabled" : ""}>
        
        <label style="margin-top:10px;">Horario</label>

        <input id="swal_horario" class="swal2-input"
        placeholder="Horario"
        value="${data.HORARIO}"
        ${editarDias ? "disabled" : ""}>
        
        <label style="margin-top:10px;">Área</label>

        <input id="swal_area" class="swal2-input"
        placeholder="Área"
        value="${data.AREA}"
        ${editarDias ? "disabled" : ""}>
        
        <label style="margin-top:10px;">Puesto</label>

        <input id="swal_puesto" class="swal2-input"
        placeholder="Puesto"
        value="${data.PUESTO}"
        ${editarDias ? "disabled" : ""}>

       

        <label style="margin-top:10px;">Días disponibles</label>

        <input id="swal_dias"
        type="number"
        class="swal2-input"
        placeholder="Días disponibles"
        value="${data.Ddisponibles}"
        ${editarDatos ? "disabled" : ""}>
        `,

        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: "Guardar",

        preConfirm: () => {

            return {

                nombre: document.getElementById("swal_nombre").value,
                horario: document.getElementById("swal_horario").value,
                area: document.getElementById("swal_area").value,
                puesto: document.getElementById("swal_puesto").value,
              
                dias: document.getElementById("swal_dias").value

            }

        }
    });

    if (formValues) {
        guardarCambios(data.ID, formValues);
    }
}




async function guardarCambios(id, valores) {

    Swal.fire({
        title: "Guardando...",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });

    try {

        const url =
URL + "?accion=actualizarEmpleado"
+ "&id=" + encodeURIComponent(id)
+ "&nombre=" + encodeURIComponent(valores.nombre)
+ "&horario=" + encodeURIComponent(valores.horario)
+ "&area=" + encodeURIComponent(valores.area)
+ "&puesto=" + encodeURIComponent(valores.puesto)

+ "&dias=" + encodeURIComponent(valores.dias);

        const response = await fetch(url);
        const data = await response.json();

        Swal.close();

        if (data.ok) {

            Swal.fire({
                icon: "success",
                title: "Empleado actualizado",
                timer: 2000,
                showConfirmButton: false
            });

        } else {

            Swal.fire("Error", data.mensaje, "error");

        }

    } catch (error) {

        Swal.close();
        Swal.fire("Error de conexión");
        console.error(error);

    }
}



function formatearFecha(fechaISO) {

    if (!fechaISO) return "";

    const fecha = new Date(fechaISO);

    const yyyy = fecha.getFullYear();
    const mm = String(fecha.getMonth() + 1).padStart(2, "0");
    const dd = String(fecha.getDate()).padStart(2, "0");

    return `${yyyy}-${mm}-${dd}`;

}
