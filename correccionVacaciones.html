<div class="page-wrapper">

    <div class="form-container">

        <h2>Corrección de Dias Asignados</h2>
        <h3>1.-Ingrese el ID del trabajador y se desplegara su información</h3>
        <h3>2.- Los dias en la tabla serán remplazados por los que ingrese en este apartado.</h3>


        <div class="form-group">
            <label>No. de empleado</label>
            <div class="inline-group">
                <input type="text" id="buscar_id">
                <button onclick="buscarTrabajador()">Buscar</button>
            </div>
        </div>
    </div>

</div>

</body>
<script>

const URL = "https://script.google.com/macros/s/AKfycbwGoTjAPPtpNxJnh8ykpvNvBabM9ZSJ3qy2IRqdF-XTjo-2SbM4auY-fN7zlWEEAOB2NA/exec"; // 🔥 PON AQUÍ TU URL DE APPS SCRIPT

async function buscarTrabajador() {

    const id = document.getElementById("buscar_id").value.trim();

    if (!id) {
        Swal.fire("Ingresa un ID");
        return;
    }

    Swal.fire({
        title: "Buscando...",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });

    try {

        const response = await fetch(URL + "?accion=buscar&id=" + id);
        const text = await response.text();
        const data = JSON.parse(text);

        Swal.close();

        if (!data.ok) {
            Swal.fire("No encontrado");
            return;
        }

        mostrarFormulario(data);

    } catch (error) {
        Swal.close();
        Swal.fire("Error de conexión");
        console.error(error);
    }
}

async function mostrarFormulario(data) {

    const { value: nuevosDias } = await Swal.fire({
        title: "Editar días disponibles",
        html: `
            <p><b>ID:</b> ${data.ID}</p>
            <p><b>Nombre:</b> ${data.NOMBRE}</p>
            <p><b>Horario:</b> ${data.HORARIO}</p>
            <p><b>Área:</b> ${data.AREA}</p>
            <p><b>Puesto:</b> ${data.PUESTO}</p>
            <p><b>Ingreso:</b> ${formatearFecha(data.INGRESO)}</p>
            <p><b>Días actuales:</b> ${data.Ddisponibles}</p>
            <hr>
            <input type="number" id="nuevo_dias" class="swal2-input" 
                   placeholder="Nuevo número de días"
                   value="${data.Ddisponibles}">
        `,
        focusConfirm: false,
        preConfirm: () => {
            return document.getElementById("nuevo_dias").value;
        },
        showCancelButton: true,
        confirmButtonText: "Guardar"
    });

    if (nuevosDias !== undefined) {
        guardarDias(data.ID, nuevosDias);
    }
}

async function guardarDias(id, dias) {

    Swal.fire({
        title: "Guardando...",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });

    try {

        const response = await fetch(
            URL + "?accion=actualizar&id=" + id + "&dias=" + dias
        );

        const text = await response.text();
        const data = JSON.parse(text);

        Swal.close();

        if (data.ok) {
           Swal.fire({
    icon: "success",
    title: "Actualizado correctamente",
    timer: 3200,
    showConfirmButton: false
}).then(() => {

    Swal.fire({
        icon: "info",
        title: "Aviso",
        html: `
            Si recientemente se hizo una corrección a los días asignados,<br>
            favor de recargar la página de solicitud de vacaciones<br>
            para actualizar valores.
        `,
        confirmButtonText: "Entendido",
        confirmButtonColor: "#2563eb"
    });

});
        } else {
            Swal.fire(data.mensaje);
        }


    } catch (error) {
        Swal.close();
        Swal.fire("Error de conexión");
        console.error(error);
    }
}


function formatearFecha(fechaISO) {
    if (!fechaISO) return "";
    const fecha = new Date(fechaISO);
    const yyyy = fecha.getFullYear();
    const mm = String(fecha.getMonth() + 1).padStart(2, "0");
    const dd = String(fecha.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
}
