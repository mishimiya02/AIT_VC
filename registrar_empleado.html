<body>

<div class="formulario">

<h2>Registro de Personal</h2>

<form id="formRegistro">

<div class="form-group">
<label>ID</label>
<input type="text" id="id" required>
</div>

<div class="form-group">
<label>Nombre</label>
<input type="text" id="nombre" required>
</div>

<div class="form-group">
<label>Horario</label>
<select id="horario">
<option value="">Seleccionar</option>
<option>8 horas</option>
<option>12 X 36</option>
<option>24 X 48</option>
<option>11 X 37</option>
</select>
</div>

<div class="form-group">
<label>Área</label>
<input type="text" id="area">
</div>

<div class="form-group">
<label>Puesto</label>
<input type="text" id="puesto">
</div>

<div class="form-group">
<label>Fecha de Ingreso</label>
<input type="date" id="ingreso">
</div>

<div class="form-group">
<label>Días Disponibles</label>
<input type="number" id="disponibles">
</div>

<button type="submit">Guardar Registro</button>

</form>

</div>


<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzdPme0vkepTT0xmejVCYCMPV46XgxkM7KpSxhhQZkT6-QDxWY7malrtMnDYzw-PmSo8Q/exec";




window.addEventListener("DOMContentLoaded", obtenerSiguienteID);

async function obtenerSiguienteID(){

try{

const res = await fetch(URL_SCRIPT);
const data = await res.json();

document.getElementById("id").value = data.nextId;

}catch(error){

console.error("Error obteniendo ID", error);

}

}











document.getElementById("formRegistro").addEventListener("submit", async function(e){

e.preventDefault();

const datos = {

id: document.getElementById("id").value,
nombre: document.getElementById("nombre").value,
horario: document.getElementById("horario").value,
area: document.getElementById("area").value,
puesto: document.getElementById("puesto").value,
ingreso: document.getElementById("ingreso").value,
disponibles: document.getElementById("disponibles").value

};

try{

const res = await fetch(URL_SCRIPT,{
method:"POST",
body: JSON.stringify(datos)
});

const respuesta = await res.json();

if(respuesta.resultado === "ok"){

alert("Registro guardado correctamente");

document.getElementById("formRegistro").reset();

}

}catch(error){

alert("Error al guardar");

console.error(error);

}

});

</script>
