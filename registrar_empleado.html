<body>

<div class="formulario">

<h2>Registro de Personal</h2>

<form id="formRegistro">

<div class="form-group">
<label>ID</label>
<input type="text" id="id" required>
</div>

<div class="form-group">
<label>Nombre</label>
<input type="text" id="nombre" required>
</div>

<div class="form-group">
<label>Horario</label>
<select id="horario">
<option value="">Seleccionar</option>
<option>8 horas</option>
<option>12 X 36</option>
<option>24 X 48</option>
<option>11 X 37</option>
</select>
</div>

<div class="form-group">
<label>Área</label>
<input type="text" id="area">
</div>

<div class="form-group">
<label>Puesto</label>
<input type="text" id="puesto">
</div>

<div class="form-group">
<label>Fecha de Ingreso</label>
<input type="date" id="ingreso">
</div>

<div class="form-group">
<label>Días Disponibles</label>
<input type="number" id="disponibles" readonly>
</div>

<button type="submit">Guardar Registro</button>

</form>

</div>


<script>

document.getElementById("ingreso").addEventListener("change", calcularDias);

function calcularDias(){

let ingreso = new Date(document.getElementById("ingreso").value);
let hoy = new Date();

let diferencia = hoy - ingreso;

let dias = Math.floor(diferencia / (1000*60*60*24));

document.getElementById("disponibles").value = dias;

}

</script>
