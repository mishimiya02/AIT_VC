    <body>
        <div class="container">
            <h1>Calculador de días por mes</h1>
            
            <div class="input-group">
                <label for="inicio">Fecha de inicio:</label>
                <input type="date" id="inicio" name="inicio" required>
            </div>
            
            <div class="input-group">
                <label for="termino">Fecha de término:</label>
                <input type="date" id="termino" name="termino" required>
            </div>
			
            <label for="termino">Tarifa</label>
            <input type="numero" id="tarifa"required>
			<br><br>	
            <button onclick="calcularDiasPorMes()">Generar reporte</button>
            
            <div id="resultado"></div>
            <br><br><a href="#" onclick="location.reload(); return false;" class="boton-recargar1">vaciar formulario</a> 
        </div>
    
       <script>
    function calcularDiasPorMes() {
        const inicio = new Date(document.getElementById('inicio').value);
        const termino = new Date(document.getElementById('termino').value);
        const tarifa = parseFloat(document.getElementById('tarifa').value);
        const resultadoDiv = document.getElementById('resultado');

        // Limpiar resultados anteriores
        resultadoDiv.innerHTML = '';

        // Validaciones
        if (isNaN(inicio.getTime()) || isNaN(termino.getTime())) {
            resultadoDiv.innerHTML = `<div class="error">Por favor, ingrese ambas fechas válidas.</div>`;
            return;
        }
        if (termino < inicio) {
            resultadoDiv.innerHTML = `<div class="error">La fecha de término debe ser posterior a la fecha de inicio.</div>`;
            return;
        }
        if (isNaN(tarifa) || tarifa <= 0) {
            resultadoDiv.innerHTML = `<div class="error">Ingrese una tarifa válida mayor que cero.</div>`;
            return;
        }

        let fechaActual = new Date(inicio);
        let desglose = [];
        let totalDias = 0;

        fechaActual.setDate(1); // primer día del mes

        while (fechaActual <= termino) {
            const año = fechaActual.getFullYear();
            const mes = fechaActual.getMonth();
            const nombreMes = fechaActual.toLocaleString('es-ES', { month: 'long' });
            const nombreMesFormateado = nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1);

            let primerDiaMes = new Date(año, mes, 1);
            let ultimoDiaMes = new Date(año, mes + 1, 0);

            let inicioMes = (primerDiaMes < inicio) ? inicio : primerDiaMes;
            let finMes = (ultimoDiaMes > termino) ? termino : ultimoDiaMes;

            const diasEnMes = Math.max(0, (finMes - inicioMes) / (1000 * 60 * 60 * 24) + 1);

            if (diasEnMes > 0) {
                const diasRedondeados = Math.round(diasEnMes);
                const resultado = tarifa / diasRedondeados;
                desglose.push({
                    mes: nombreMesFormateado,
                    año: año,
                    dias: diasRedondeados,
                    division: resultado.toFixed(2)
                });
                totalDias += diasRedondeados;
            }

            fechaActual.setMonth(fechaActual.getMonth() + 1);
        }

        // Mostrar resultados
        if (desglose.length === 0) {
            resultadoDiv.innerHTML = `<div class="error">No hay días para mostrar en el rango seleccionado.</div>`;
            return;
        }

        let html = `
            <div class="total-dias">Total de días: ${totalDias}</div>
            <table>
                <thead>
                    <tr>
                        <th>Mes</th>
                        <th>Año</th>
                        <th>Días</th>
                        <th>Tarifa Diaria</th>
                    </tr>
                </thead>
                <tbody>
        `;

        desglose.forEach(item => {
            html += `
                <tr>
                    <td>${item.mes}</td>
                    <td>${item.año}</td>
                    <td>${item.dias}</td>
                    <td>$${item.division}</td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>
        `;

        resultadoDiv.innerHTML = html;
    }
</script>
