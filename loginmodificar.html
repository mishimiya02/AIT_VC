<!DOCTYPE html>
<html lang="es">
<head>

  <title>Iniciar sesión</title>

  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: #0300a8c0; font-family: sans-serif;

  </style>
</head>
<body>
  <div id="loginBox">
    <h2>Iniciar sesión</h2>
    <input id="usuario" placeholder="Usuario" />

  <script src="java/loginmodificar.js"></script>
