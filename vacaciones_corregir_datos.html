<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gestión de Trabajadores</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
padding:30px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

.field{
margin-bottom:15px;
display:flex;
flex-direction:column;
}

label{
font-weight:bold;
margin-bottom:5px;
}

input{
padding:8px;
border:1px solid #ccc;
border-radius:4px;
}

button{
padding:10px;
border:none;
background:#2c7be5;
color:white;
border-radius:4px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1a5fd0;
}

.buscador{
display:flex;
gap:10px;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<h2>Editar Trabajador</h2>

<div class="buscador">

<input type="text" id="buscarId" placeholder="Buscar ID trabajador">

<button onclick="buscarTrabajador()">Buscar</button>

</div>

<form id="formTrabajador">

<div class="field">
<label>ID</label>
<input type="text" name="id" readonly>
</div>

<div class="field">
<label>Nombre</label>
<input type="text" name="nombre">
</div>

<div class="field">
<label>Horario</label>
<input type="text" name="horario">
</div>

<div class="field">
<label>Área</label>
<input type="text" name="area">
</div>

<div class="field">
<label>Puesto</label>
<input type="text" name="puesto">
</div>

<div class="field">
<label>Ingreso</label>
<input type="date" name="ingreso">
</div>

<button type="button" onclick="guardarCambios()">
Guardar Cambios
</button>

</form>

</div>

<script>

let filaActual = null;

function buscarTrabajador(){

const id = document.getElementById("buscarId").value;

if(!id){
alert("Ingresa un ID");
return;
}

google.script.run
.withSuccessHandler(function(data){

if(!data){
alert("Trabajador no encontrado");
return;
}

document.querySelector("[name='id']").value = data.id;
document.querySelector("[name='nombre']").value = data.nombre;
document.querySelector("[name='horario']").value = data.horario;
document.querySelector("[name='area']").value = data.area;
document.querySelector("[name='puesto']").value = data.puesto;

if(data.ingreso){
document.querySelector("[name='ingreso']").value =
new Date(data.ingreso).toISOString().substring(0,10);
}

filaActual = data.fila;

})
.buscarTrabajadorPorId(id);

}

function guardarCambios(){

if(!filaActual){
alert("Primero busca un trabajador");
return;
}

const data = {

fila: filaActual,
id: document.querySelector("[name='id']").value,
nombre: document.querySelector("[name='nombre']").value,
horario: document.querySelector("[name='horario']").value,
area: document.querySelector("[name='area']").value,
puesto: document.querySelector("[name='puesto']").value,
ingreso: document.querySelector("[name='ingreso']").value

};

google.script.run
.withSuccessHandler(function(){

alert("Trabajador actualizado correctamente");

})
.actualizarTrabajador(data);

}

</script>

</body>
</html>
